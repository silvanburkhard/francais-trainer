:root[data-theme="dark"]{color-scheme:dark;

  --ok:#4cc26a;--ok-bg:#12301b;--warn:#f0b04a;--warn-bg:#33260f;--bad:#ff6b5e;--bad-bg:#3a1512;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:clamp(40px,10vw,64px);line-height:1;font-weight:700;margin:40px 0 16px;letter-spacing:-.02em}
h2{font-size:24px;line-height:1.2;font-weight:700;margin:40px 0 16px}
.sub{font-size:20px;font-weight:700;line-height:1.4;margin:0 0 8px}
.card{padding:20px 0;border-top:1px solid var(--line);margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
/* Top-Leiste und Brotkrumen */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:700}
.topbar a{color:var(--text);text-decoration:none}
.crumb{display:flex;gap:8px;align-items:center;min-width:0}
.crumb a{color:var(--muted)}
.crumb span{color:var(--muted);font-weight:400}
.topbar svg,.ic{width:20px;height:20px;flex:none;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar .set{display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:44px;min-width:44px}
.crumb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){.topbar .set span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat{border-top:2px solid var(--text);padding-top:8px}
.stat b{display:block;font-size:40px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px;font-weight:700}
/* Knöpfe */
.btn{display:block;width:100%;min-height:52px;border:1.5px solid var(--text);border-radius:0;font-weight:700;padding:12px 18px;margin-bottom:8px;background:transparent;color:var(--text);text-align:left;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary::after{content:" →"}
.btn:not(:disabled):hover{background:var(--text);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible,.seg label:focus-within,input:focus-visible,.link:focus-visible,.acc button:focus-visible,.opt:focus-visible,.topic a:focus-visible,.topbar a:focus-visible,footer a:focus-visible,summary:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.hint{color:var(--muted);font-size:15px;margin:8px 0 0}
.seg{display:flex;border:1.5px solid var(--text)}
.seg label{flex:1;text-align:center;padding:10px 4px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;border-left:1.5px solid var(--text)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--text);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:0;padding:8px 12px;min-height:44px;font-size:16px}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .st{margin-right:6px;font-size:12px}
.row-head{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}
.row-head h2{margin:0}
.link{border:0;background:none;color:var(--text);font-weight:700;font-size:15px;padding:10px 4px;min-height:44px;text-decoration:none;display:inline-block}
.link:hover{text-decoration:underline}
.legend{color:var(--muted);font-size:14px;margin:12px 0 0}
/* Themenliste */
.topic{border-top:1px solid var(--line);padding:18px 0}
.section .topic:last-child{border-bottom:1px solid var(--line)}
.topic .head{display:flex;align-items:center;gap:16px}
.topic a.name{flex:1;min-width:0;color:inherit;text-decoration:none;padding:4px 0}
.topic a.name:hover b{text-decoration:underline}
.topic .name b{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:22px;line-height:1.2}
.topic .name>span{color:var(--muted);font-size:15px;font-weight:700}
.topic .btn{width:auto;min-height:44px;margin:0;padding:8px 16px;font-size:15px}
.topic .btn.primary::after{content:""}
.badge{font-size:13px;font-weight:700;color:var(--muted)}

.prog{display:block;margin-top:12px}
.pbar{display:flex;height:6px;background:var(--line);overflow:hidden}
.prog.big .pbar{height:12px}
.pbar i{display:block;height:100%}
.pbar .s{background:var(--text)}
.pbar .l{background:var(--learn)}
.plab{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.plab b{color:var(--text);font-variant-numeric:tabular-nums}
.prog.big .plab b{font-size:28px}
.dot{display:inline-block;width:10px;height:10px;margin:0 6px 0 14px;vertical-align:-1px}
.dot:first-child{margin-left:0}
.dot.s{background:var(--text)}.dot.l{background:var(--learn)}.dot.n{background:var(--line)}
/* Gliederung */
.header{display:block}
.section{margin-top:56px}
.section>h2:first-child,.section>.row-head:first-child{margin-top:0}
.section .card:last-child,.section .btn:last-child{margin-bottom:0}
.duehint{color:var(--muted);font-size:15px;margin:12px 0 0}
details summary .prog{margin:8px 0 2px;font-weight:400}
details summary .plab{font-size:13px}
/* Einstellungen */
.group{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow.col{display:block}
.setrow.col .seg{margin-top:12px}
.lbl{flex:1;min-width:0}
.lbl b{display:block;font-weight:700}
.lbl span{display:block;color:var(--muted);font-size:15px}
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle:checked{background:var(--text)}
.toggle:checked::after{transform:translateX(20px);background:var(--bg)}
.toggle:focus-visible{outline:3px solid var(--text);outline-offset:3px}

.ex h3{font-size:20px;margin:28px 0 8px}
.ex h3:first-child{margin-top:0}
.ex p,.ex li{margin:0 0 10px}
.ex ul{padding-left:20px;margin:0 0 10px}
.ex table{border-collapse:collapse;width:100%;font-size:16px;margin:4px 0 16px;overflow-wrap:anywhere}

.ex th{font-size:14px;color:var(--muted);font-weight:700}
.ex .note{border-left:3px solid var(--text);padding:4px 0 4px 14px;margin:12px 0 16px}
.ex b.k{text-decoration:underline;text-underline-offset:3px}
details{border-bottom:1px solid var(--line);padding:6px 0}
details summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px}

.count{color:var(--muted);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--text);transition:width .3s}
.tense{color:var(--muted);font-size:15px;font-weight:700}
.word{font-size:clamp(32px,8vw,48px);font-weight:700;letter-spacing:-.02em;margin:8px 0 0;line-height:1.1}
.word.q{font-size:26px;letter-spacing:0;line-height:1.3}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--text);text-align:center}
.qhint{color:var(--muted);font-size:15px;margin-top:8px}
.line{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.pr{width:84px;flex:none;color:var(--muted);text-align:right;font-weight:700}
.weak .pr::after{content:" •";color:var(--warn)}
input[type=text]{flex:1;min-width:0;width:100%;font:inherit;font-size:20px;color:var(--text);background:var(--field);border:0;border-bottom:2px solid var(--text);border-radius:0;padding:10px 12px;min-height:48px}
input.ok{background:var(--ok-bg);border-color:var(--ok)}
input.warn{background:var(--warn-bg);border-color:var(--warn)}
input.bad{background:var(--bad-bg);border-color:var(--bad)}
.mark{width:22px;flex:none;font-weight:700;text-align:center}
.fix{font-size:15px;margin:-2px 0 6px 96px}
.fix.warn,.res.warn{color:var(--warn)}.fix.bad,.res.bad{color:var(--bad)}.res.ok{color:var(--ok)}
.weaknote{font-size:14px;color:var(--muted);margin:8px 0 0}
.inf{display:flex;gap:8px;margin-top:16px}
.inf .btn{width:auto;margin:0}
.result{font-weight:700;margin:4px 0 12px}
.why{border-left:3px solid var(--text);padding:4px 0 4px 14px;margin:0 0 16px;font-size:16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{margin:0;padding:8px 4px;font-size:15px;text-align:center}
.grades .btn::after{content:""}
.grades small{display:block;font-weight:400;opacity:.8;font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:20px}
.opt{min-height:52px;border:1.5px solid var(--text);background:transparent;border-radius:0;font-size:18px;font-weight:700}
.opt:not(:disabled):hover{background:var(--text);color:var(--bg)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.answer{margin-top:16px}
.acc{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.acc button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:0;background:var(--bg);font-size:19px}
.danger{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.big{font-size:80px;line-height:1;font-weight:700;margin:4px 0 0}
/* Fusszeile */
footer{max-width:720px;margin:0 auto;padding:24px 16px calc(140px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
body:has(.top) footer{display:none}
footer nav{display:flex;gap:24px}
footer a{color:var(--muted);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
footer a:hover{color:var(--text)}
footer p{margin:0;display:flex;align-items:center;gap:8px;min-height:44px}
.legal a{color:var(--text)}
.legal h2{font-size:22px;margin:32px 0 8px}
.legal p{margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.bar i,.toggle,.toggle::after{transition:none}}

const VERBS=VERB_RAW.split('\n').map(l=>{const[fr,de,f,like]=l.split('|');return{fr,de,forms:f.split(','),like}});
const BY=Object.fromEntries(VERBS.map(v=>[v.fr,v]));
const PRON=['je','tu','il/elle','nous','vous','ils/elles'];
const pron=(v,i)=>v.forms.length===1?'il':i?PRON[i]:(/^[aeiouyhéèêâîô]/.test(v.forms[0])?"j'":'je');

const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/\s*\/\s*/g,'/').replace(/\s*,\s*/g,'/').replace(/\s+/g,' ').trim();
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const clean=s=>s.replace(/\([^)]*\)/g,'').replace(/\b(qn|qc)(\/(qn|qc))?\b/g,'').replace(/\s+/g,' ').trim().replace(/ faire$/,'').trim();
function judgeList(input,acc,half){
  const x=norm(clean(input)),A=acc.map(a=>norm(clean(a)));
  if(A.includes(x))return 0;
  if(x&&A.some(a=>strip(a)===strip(x)))return S.opt.strict?1:.5;
  if(half&&half.map(norm).includes(x))return .5;
  return 1;
}
const judge=(input,answer)=>judgeList(input,answer.split('/'));

const CARDS={}; // id -> {type, topic, ...}

  const[fr,de]=l.split('|'),alts=fr.split(' ; '),disp=alts[0];
  const acc=[];alts.forEach(a=>{const c=clean(a);acc.push(c);if(c.includes('/'))acc.push(c.split('/')[0])});
  CARDS['w:'+disp]={type:'vocab',topic:'vocab',fr:disp,de,acc};
});
PAIR_RAW.split('\n').forEach(l=>{const[g,fr,de]=l.split('|');CARDS['p:'+fr]={type:'pair',topic:'comp',g,fr,de,acc:[fr]}});

// ===================== SPACED REPETITION (vereinfachtes SM-2) =====================
// g: 0 Nochmals, 1 Schwer, 2 Gut, 3 Einfach
function nextIvl(c,g){return g===0?0:g===1?(c.reps?Math.max(1,c.ivl*1.2):1):g===2?(c.reps===0?1:c.reps===1?3:c.ivl*c.ease):(c.reps===0?3:c.ivl*c.ease*1.3)}
function schedule(id,g,mode){
  const c=card(id),now=Date.now();
  if(mode==='all'&&g>=2&&c.reps>0)return; // freies Üben schiebt nichts nach hinten
  if(g===0){c.lapses++;c.reps=0;c.ease=Math.max(1.3,c.ease-.2);c.ivl=0;c.due=now+6e4;return}
  c.ivl=nextIvl(c,g);
  if(g===1)c.ease=Math.max(1.3,c.ease-.15);
  if(g===3)c.ease+=.15;
  c.reps++;c.due=now+c.ivl*DAY;
}
function preview(id,g){
  const c=card(id);
  if(S.session.mode==='all'&&g>=2&&c.reps>0)return'unverändert';
  const d=Math.round(nextIvl(c,g));
  return g===0?'gleich nochmals':d===1?'1 Tag':d+' Tage';
}

  const t=TOP[tid],ids=cardsOf(tid),c=counts(ids);
  let extra='';
  if(tid==='comp')extra=`<p>Im Französischen braucht ein Verb oft eine andere Ergänzung als im Deutschen. Die Listen aus dem Cahier:</p>`
    +PAIR_GROUPS.map(([g,title,note])=>{const rows=PAIR_RAW.split('\n').filter(l=>l.split('|')[0]===g);
      return`<details><summary>${g.replace(/[ab]/,'')}. ${title}${prog(rows.map(l=>'p:'+l.split('|')[1]))}</summary>${note?`<p class="hint">${note}</p>`:''}<table>${rows.map(l=>{const[,fr,de]=l.split('|');return`<tr><td><b>${fr}</b></td><td>${de}</td></tr>`}).join('')}</table></details>`}).join('')
    +`<div class="note" style="margin-top:12px">Zusammenziehungen: à + le = <b>au</b> · à + les = <b>aux</b> · de + le = <b>du</b> · de + les = <b>des</b> · vor Vokal: <b>d'</b></div>`;
  const verbSel=tid!=='verbs'?'':`<section class="section"><div class="row-head" style="margin-top:0"><h2>Verben auswählen</h2><span><button class="link" id="selAll">Alle</button><button class="link" id="selNone">Keine</button></span></div>
    <div class="card"><div class="chips">${VERBS.map(v=>{const st=status('v:'+v.fr),sym={new:'○',learn:'◐',sure:'●'}[st],lab={new:'neu',learn:'am Lernen',sure:'sicher'}[st];
      return`<button class="chip" data-fr="${v.fr}" aria-pressed="${S.sel.includes(v.fr)}" aria-label="${v.fr}, ${lab}"><span class="st" aria-hidden="true">${sym}</span>${v.fr}</button>`}).join('')}</div></div>
    <p class="legend">○ neu · ◐ am Lernen · ● sicher · Nur ausgewählte Verben werden abgefragt.</p></section>`;
  app.innerHTML=`${topbar(t.title)}
  <h1>${t.title}</h1><p class="sub">${t.sub}</p>
  <section class="section"><h2>Fortschritt</h2><div class="card">${prog(ids,true)}${c.due?`<p class="duehint">${c.due} von ${c.total} fällig.</p>`:nextDue(ids)}</div>${LEGEND}</section>
  <section class="section"><h2>Lernen</h2>
    <button class="btn primary" id="learn" ${c.due?'':'disabled'}>Fällige lernen (${c.due})</button>
    <button class="btn" id="all" ${c.total?'':'disabled'}>Alle ${c.total} durchgehen</button>
    <p class="hint">«Alle durchgehen» ist zum Pauken: Fehler fliessen in die Wiederholung ein, richtige Antworten verschieben nichts.</p>
  </section>
  ${verbSel}
  <section class="section"><h2>Erklärung</h2><div class="card ex">${EXPLAIN[tid]||''}${extra}</div></section>
  <section class="section"><span id="treset"><button class="link danger" id="tresetBtn">Fortschritt dieses Themas zurücksetzen</button></span></section>`;
  $('learn').onclick=()=>start('due',tid);$('all').onclick=()=>start('all',tid);
  confirmReset('treset',`${t.title} zurücksetzen?`,()=>{
    const del=tid==='verbs'?VERBS.map(v=>'v:'+v.fr):ids;del.forEach(id=>delete S.cards[id]);
    if(S.session&&S.session.queue.some(id=>del.includes(id)))S.session=null},()=>topicPage(tid));
  if(tid==='verbs'){
    $('selAll').onclick=()=>{S.sel=VERBS.map(v=>v.fr);save();topicPage(tid)};
    $('selNone').onclick=()=>{S.sel=[];save();topicPage(tid)};
    app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const f=b.dataset.fr;S.sel=S.sel.includes(f)?S.sel.filter(x=>x!==f):[...S.sel,f];save();topicPage(tid);const n=app.querySelector(`.chip[data-fr="${f}"]`);n&&n.focus()});
  }
}

// ===================== EINSTELLUNGEN =====================
function settings(){
  cur=null;
  const o=S.opt;
  const dirHint=S.dir==='fr'?'Verben: Du siehst den Infinitiv. Vokabeln: Du siehst das französische Wort und bewertest dich selbst.':S.dir==='de'?'Du siehst das deutsche Wort und schreibst das französische.':'Zufällig mal Deutsch, mal Französisch.';
  app.innerHTML=`${topbar('Einstellungen')}<h1>Einstellungen</h1>
  <section class="section"><h2>Abfrage</h2><div class="group">
    <div class="setrow col"><div class="lbl"><b>Richtung bei Verben und Vokabeln</b><span>${dirHint}</span></div>${seg('dir',[['de','Deutsch → Franz.'],['fr','Französisch'],['mix','Gemischt']],S.dir,'Abfragerichtung')}</div>
    <div class="setrow"><label class="lbl" for="strict"><b>Akzente streng bewerten</b><span>Ein fehlender oder falscher Akzent zählt als Fehler statt als «fast richtig».</span></label><input type="checkbox" class="toggle" id="strict" ${o.strict?'checked':''}></div>
  </div></section>
  <section class="section"><h2>Prüfung</h2><div class="group">
    <div class="setrow col"><div class="lbl"><b>Anzahl Aufgaben</b><span>Die Aufgaben werden gleichmässig auf alle Themen verteilt.</span></div>${seg('examLen',[[10,'10'],[20,'20'],[30,'30'],[50,'50']],o.examLen,'Anzahl Aufgaben')}</div>
  </div></section>
  <section class="section"><h2>Darstellung</h2><div class="group">
    <div class="setrow"><label class="lbl" for="accBar"><b>Akzentleiste anzeigen</b><span>Tasten für é, è, ç … unten am Bildschirm.</span></label><input type="checkbox" class="toggle" id="accBar" ${o.accBar?'checked':''}></div>
    <div class="setrow col"><div class="lbl"><b>Erscheinungsbild</b></div>${seg('theme',[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']],o.theme,'Erscheinungsbild')}</div>
  </div></section>
  <section class="section"><h2>Daten</h2><div class="group">
    <div class="setrow"><div class="lbl"><b>Gesamten Fortschritt zurücksetzen</b><span>Löscht den Lernstand aller Themen auf diesem Gerät.</span></div><span id="reset"><button class="link danger" id="resetBtn">Zurücksetzen</button></span></div>
  </div></section>`;
  const set=(k,v)=>{if(k==='dir')S.dir=v;else o[k]=v;save();applyTheme();const f=document.activeElement&&document.activeElement.name;settings();if(f){const n=app.querySelector(`input[name=${f}]:checked`);n&&n.focus()}};
  app.querySelectorAll('.seg input').forEach(r=>r.onchange=()=>set(r.name,r.name==='examLen'?+r.value:r.value));
  ['strict','accBar'].forEach(k=>$(k).onchange=e=>{o[k]=e.target.checked;save()});
  confirmReset('reset','Alles löschen?',()=>{S.cards={};S.session=null},settings);
}

// ===================== SITZUNG =====================
function start(mode,tid){
  let ids=shuffle(cardsOf(tid).filter(id=>mode==='all'||isDue(id)));
  if(mode==='due')ids.sort((a,b)=>(S.cards[a]?S.cards[a].due:Infinity)-(S.cards[b]?S.cards[b].due:Infinity)); // Wiederholungen zuerst
  if(!ids.length)return;
  S.session={mode,topic:tid,queue:ids,total:ids.length,done:0};save();
  if(location.hash){history.replaceState(null,'',location.pathname+location.search)}
  next_();
}
function startExam(){
  // S.opt.examLen Aufgaben, möglichst gleichmässig über die Lernziele verteilt
  const pools=TOPICS.map(t=>shuffle(cardsOf(t.id))).filter(p=>p.length);const q=[];
  for(let i=0;q.length<S.opt.examLen&&pools.some(p=>p.length);i++){const p=pools[i%pools.length];if(p.length)q.push(p.pop())}
  S.session={mode:'exam',exam:true,queue:shuffle(q),total:q.length,done:0,pts:0,max:0,weak:{}};save();next_();
}
let cur=null;
function next_(){
  const s=S.session;
  if(!s||!s.queue.length){const t=s;S.session=null;save();return done(t)}
  const id=s.queue[0],c=CARDS[id];
  let dir=S.dir==='mix'?(Math.random()<.5?'de':'fr'):S.dir;
  if(c.type==='vocab'&&s.exam)dir='de';
  cur={id,c,dir,phase:'ask',infErr:0,errors:0};
  if(c.type==='verb'&&dir==='de')cur.phase='inf';
  render();
}
function frame(label,promptHtml,body){
  const s=S.session;
  return`<div class="top"><button class="link" id="quit">‹ Beenden</button><span class="count">${s.done} / ${s.total}</span></div>
  <div class="bar"><i style="width:${s.done/s.total*100}%"></i></div>
  <section class="card"><div class="tense">${label}</div>${promptHtml}<div id="inf"></div></section>${body}
  <div id="actions"></div>`;
}
const ACC=()=>!S.opt.accBar?'':`<div class="acc" aria-label="Akzente">${'é è ê ë à â ç î ï ô û ù œ'.split(' ').map(a=>`<button tabindex="-1" data-a="${a}">${a}</button>`).join('')}</div>`;
const INPUT=(id,label,hint)=>`<input type="text" id="${id}" lang="fr" aria-label="${label}" placeholder="${label}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${hint||'done'}">`;

function render(){
  const {c,dir}=cur,t=TOP[c.topic].title;
  if(c.type==='verb')return renderVerb();
  if(c.type==='vocab'&&dir==='fr'){
    app.innerHTML=frame(`${t} · Französisch → Deutsch`,`<h1 class="word" lang="fr">${esc(c.fr)}</h1>`,'')+ACC();
    $('actions').innerHTML=`<button class="btn primary" id="show">Lösung zeigen</button>`;
    $('show').onclick=()=>{$('inf').innerHTML=`<p class="result" style="margin-top:12px">${esc(c.de)}</p>`;
      $('actions').innerHTML='';showGrades(null,'Wusstest du es?')};
    $('show').focus();
  }else if(c.type==='vocab'||c.type==='pair'){
    const lab=c.type==='vocab'?`${t} · Deutsch → Französisch`:`${t} · Verb mit Ergänzung`;
    const hint=c.type==='vocab'?'Nomen mit Artikel':'z. B. «aider qn» oder «téléphoner à qn»';
    app.innerHTML=frame(lab,`<h1 class="word" lang="de">${esc(c.de)}</h1><p class="qhint">${hint}</p>`,`<div class="answer card">${INPUT('ans','Auf Französisch')}<div id="fix"></div></div>`)+ACC();
    $('actions').innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;
    $('chk').onclick=()=>checkSingle();$('ans').focus();
  }else{ // item
    const body=c.o?`<div class="opts">${c.o.map((o,i)=>`<button class="opt" data-o="${esc(o)}" lang="fr">${esc(o)}</button>`).join('')}</div>`
      :`<div class="answer card">${INPUT('ans','Deine Antwort')}<div id="fix"></div></div>`;
    app.innerHTML=frame(t,`<p class="word q" lang="fr">${gapify(c.q)}</p>${c.h?`<p class="qhint">${esc(c.h)}</p>`:''}`,body)+(c.o?'':ACC());
    if(c.o){app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>checkSingle(b.dataset.o));app.querySelector('.opt').focus()}
    else{$('actions').innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;$('chk').onclick=()=>checkSingle();$('ans').focus()}
  }
  wire();
}
function wire(){
  $('quit').onclick=()=>{location.hash='';home()};
  app.querySelectorAll('.acc button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>insert(b.dataset.a)});
  const a=$('ans');if(a)a.onkeydown=e=>{if(e.key==='Enter'&&cur.phase==='ask'){e.preventDefault();e.stopPropagation();checkSingle()}};
}
function checkSingle(choice){
  if(cur.phase!=='ask')return;
  const c=cur.c;let input=choice;
  if(input===undefined){const a=$('ans');input=a.value;a.readOnly=true}
  const acc=c.type==='item'?c.a:c.acc;
  const r=judgeList(input,acc,c.half);
  cur.errors=r;cur.phase='checked';
  const cls=r===0?'ok':r<1?'warn':'bad';
  if(c.o){app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(acc.includes(b.dataset.o))b.classList.add('ok');else if(b.dataset.o===input)b.classList.add('bad')})}
  else{$('ans').className=cls;
    const shown=c.type==='vocab'?c.fr:c.type==='pair'?c.fr:acc[0];
    $('fix').innerHTML=r===0?'':`<p class="res ${cls}" style="margin:8px 0 0">${r<1?'Fast – richtig ist':'Richtig ist'}: <b lang="fr">${esc(shown)}</b></p>`;}
  const msg=r===0?'✓ Richtig':r<1?(c.half&&c.half.includes(input)?'~ Fast: Zusammenziehung beachten':'~ Fast: Akzent beachten'):'✗ Falsch';
  let why=c.w||'';
  if(c.type==='vocab'&&r>0)why=`${esc(c.fr)} = ${esc(c.de)}`;
  if(c.type==='pair')why=r>0?`<b lang="fr">${esc(c.fr)}</b> – ${esc(c.de)}`:'';
  if(LINK[cur.id]&&r>0&&!S.session.exam){const L=card(LINK[cur.id]);L.due=Math.min(L.due||0,Date.now())}
  showGrades(r===0?2:r<1?2:0,`<span class="res ${cls}">${msg}</span>`,why);
}
function showGrades(sug,msg,why){
  const s=S.session;
  if(s.exam){
    $('actions').innerHTML=`<p class="result" role="status">${msg}</p>${why?`<div class="why">${why}</div>`:''}<button class="btn primary" id="go">Weiter</button>`;
    $('go').onclick=()=>examNext();$('go').focus();return;
  }
  if(sug===null)sug=2;
  cur.sug=sug;
  const names=['Nochmals','Schwer','Gut','Einfach'];
  $('actions').innerHTML=`<p class="result" role="status">${msg}</p>${why?`<div class="why">${why}</div>`:''}
  <div class="grades">${names.map((n,g)=>`<button class="btn ${g===sug?'primary':''}" data-g="${g}">${n}<small>${preview(cur.id,g)}</small></button>`).join('')}</div>
  <p class="hint">Enter wählt den Vorschlag, Tasten 1–4 wählen direkt.</p>`;
  app.querySelectorAll('.grades .btn').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  app.querySelector('.grades .primary').focus();
  cur.phase='checked';
}
function examNext(){
  if(cur.phase==='done')return;
  const s=S.session,c=cur.c;
  const max=c.type==='verb'?c.v.forms.length+(cur.dir==='de'?1:0):1;
  const lost=Math.min(max,cur.errors);
  s.max+=max;s.pts+=max-lost;
  if(lost>0){s.weak[c.topic]=(s.weak[c.topic]||0)+1;const k=card(cur.id);k.due=Math.min(k.due||0,Date.now())}
  s.queue.shift();s.done++;cur.phase='done';save();next_();
}

// ----- Verben -----
function renderVerb(){
  const {c,dir}=cur,v=c.v,k=card(cur.id);
  app.innerHTML=frame(`Présent · ${dir==='de'?'Deutsch → Französisch':'Französisch'}`,`<h1 class="word" lang="${dir==='de'?'de':'fr'}">${dir==='de'?v.de:v.fr}</h1>`,
  `<section class="card" id="table" ${cur.phase==='inf'?'hidden':''} lang="fr">
    ${v.forms.map((f,i)=>`<div class="line ${v.forms.length>1&&k.err[i]>=2?'weak':''}"><label class="pr" for="f${i}">${pron(v,i)}</label><input type="text" id="f${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${i===v.forms.length-1?'done':'next'}"><span class="mark" aria-hidden="true"></span></div><div class="fix" id="x${i}" aria-live="polite"></div>`).join('')}
    ${v.forms.length>1&&k.err.some(e=>e>=2)?'<p class="weaknote">• Hier hattest du schon öfter Fehler.</p>':''}
  </section>`)+ACC();
  wire();
  app.querySelectorAll('#table input').forEach((inp,i,all)=>inp.onkeydown=e=>{if(e.key!=='Enter'||cur.phase!=='table')return;e.preventDefault();e.stopPropagation();const n=[...all].slice(i+1).find(x=>!x.value)||[...all].find(x=>!x.value);n?n.focus():checkVerb()});
  if(cur.phase==='inf'){
    const box=$('inf');
    box.innerHTML=`<div class="inf">${INPUT('infIn','Infinitiv auf Französisch','next')}<button class="btn primary" id="infGo">Weiter</button></div>`;
    const inp=$('infIn');inp.focus();
    const go=()=>{const r=judge(inp.value,v.fr);cur.infErr=r;cur.phase='table';
      box.innerHTML=`<p class="result res ${r===0?'ok':r<1?'warn':'bad'}" style="margin-top:12px">${r===0?'✓':r<1?'~':'✗'} ${v.fr}${r?` <span style="font-weight:400">(du: ${esc(inp.value)||'–'})</span>`:''}</p>`;
      $('table').hidden=false;$('f0').focus();verbActions()};
    $('infGo').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();go()}};
  }else{cur.phase='table';$('f0').focus();verbActions()}
}
function verbActions(){$('actions').innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;$('chk').onclick=checkVerb}
function checkVerb(){
  if(cur.phase!=='table')return;
  const v=cur.c.v,k=card(cur.id);let sum=cur.infErr,right=0;
  v.forms.forEach((f,i)=>{
    const inp=$('f'+i),r=judge(inp.value,f),cls=r===0?'ok':r<1?'warn':'bad';
    inp.className=cls;inp.readOnly=true;sum+=r;if(r===0)right++;if(r&&!S.session.exam)k.err[i]++;
    inp.nextElementSibling.textContent=r===0?'✓':r<1?'~':'✗';
    const x=$('x'+i);x.className='fix '+cls;
    x.textContent=r===0?'':(r<1?'Akzent: ':'Richtig: ')+f.replace('/',' oder ');
  });
  cur.errors=sum;cur.phase='checked';
  const why=sum>0&&v.like?`Tipp: <b lang="fr">${v.fr}</b> wird konjugiert wie <b lang="fr">${v.like}</b>.`:'';
  showGrades(sum<=.5?2:sum<=2?1:0,`${right} von ${v.forms.length} richtig${cur.infErr?' · Infinitiv falsch':''}`,why);
}

let last=null;document.addEventListener('focusin',e=>{if(e.target.matches('input[type=text]'))last=e.target});
function insert(ch){const i=last;if(!i||i.readOnly)return;const a=i.selectionStart??i.value.length,b=i.selectionEnd??a;i.value=i.value.slice(0,a)+ch+i.value.slice(b);i.focus();i.setSelectionRange(a+1,a+1)}
document.addEventListener('keydown',e=>{
  if(!cur||!S.session)return;
  if(cur.phase==='ask'&&cur.c.o&&/^[1-9]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b){e.preventDefault();b.click()}return}
  if(cur.phase!=='checked'||S.session.exam)return;
  if(e.key==='Enter'){e.preventDefault();grade(cur.sug)}
  else if('1234'.includes(e.key)&&e.key.length===1){grade(+e.key-1)}
});
function grade(g){
  if(cur.phase!=='checked')return;
  const s=S.session,id=cur.id;cur.phase='done';
  schedule(id,g,s.mode);s.queue.shift();
  if(g===0)s.queue.splice(Math.min(3,s.queue.length),0,id);        // in ca. 1 Minute nochmals
  else if(s.mode==='all'&&cur.errors>=1)s.queue.push(id);           // am Ende der Runde nochmals
  else s.done++;
  save();next_();
}
function done(s){
  cur=null;
  if(s&&s.exam){
    const note=s.max?Math.round((5*s.pts/s.max+1)*2)/2:1;
    const weak=Object.entries(s.weak).sort((a,b)=>b[1]-a[1]);
    app.innerHTML=`<h1>Prüfung fertig</h1><p class="sub">${Math.round(s.pts*10)/10} von ${s.max} Punkten</p>
    <section class="card"><div class="tense">Note</div><p class="big">${note.toFixed(1)}</p></section>
    ${weak.length?`<h2>Das solltest du noch üben</h2>${weak.map(([t,n])=>`<div class="topic"><a class="name" href="#t-${t}"><b>${TOP[t].title}</b><span>${n} Fehler</span></a></div>`).join('')}<p class="hint">Falsch beantwortete Aufgaben sind jetzt fällig und kommen beim nächsten Lernen dran.</p>`:'<p>Keine Fehler. Stark!</p>'}
    <button class="btn primary" id="back">Zur Übersicht</button>`;
  }else{
    app.innerHTML=`<h1>Runde fertig</h1><p class="sub">${s?`Du hast alle ${s.total} Aufgaben dieser Runde richtig gelöst.`:'Keine Aufgaben in dieser Runde.'}</p><button class="btn primary" id="back">Zur Übersicht</button>`;
  }
  $('back').onclick=()=>{location.hash='';home()};$('back').focus();
}

const LEGAL={
datenschutz:`<h1>Datenschutz</h1>
<h2>Verantwortlich</h2>
<p>${OWNER.name}, E-Mail: <a href="mailto:${OWNER.email}">${OWNER.email}</a></p>
<h2>Speicherung in deinem Browser</h2>
<p>Die Seite speichert deine Auswahl, deine Einstellungen und deinen Lernstand im Local Storage deines Browsers, damit der Wiederholungsplan funktioniert. Diese Daten bleiben auf deinem Gerät und werden nicht an mich oder Dritte übertragen. Es gibt keine Cookies, kein Tracking und keine Inhalte von Drittanbietern.</p>
<p>Du kannst diese Speicherung ablehnen oder die Daten löschen: mit «Zurücksetzen» in den Einstellungen oder indem du die Websitedaten in deinem Browser löschst bzw. sperrst. Der Trainer merkt sich dann deinen Fortschritt nicht mehr.</p>
<h2>Hosting</h2>
<p>Die Seite wird von ${OWNER.host} (${OWNER.hostCountry}) bereitgestellt. Beim Aufruf verarbeitet der Anbieter technisch notwendige Daten wie deine IP-Adresse, um die Seite auszuliefern und vor Missbrauch zu schützen. Diese Daten werden dabei in die USA übermittelt.</p>
<h2>Deine Rechte</h2>
<p>Du kannst jederzeit per E-Mail Auskunft über deine Daten verlangen oder ihrer Bearbeitung widersprechen.</p>`};
function legal(k){cur=null;app.innerHTML=`${topbar('Datenschutz')}<article class="legal">${LEGAL[k]}</article>`;scrollTo(0,0)}
function route(){
  const k=location.hash.slice(1);
  scrollTo(0,0);
  if(LEGAL[k])return legal(k);
  if(k==='einstellungen')return settings();
  if(k.startsWith('t-')&&TOP[k.slice(2)])return topicPage(k.slice(2));
  home();
}
addEventListener('hashchange',route);
route();
