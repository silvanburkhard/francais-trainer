<title>Français – Dossier 5 Trainer</title>
<style>
/* Schweizer Grafik: Helvetica, Schwarz auf Weiss, Haarlinien statt Karten */

}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#000;--text:#fff;--muted:#9a9a9a;--line:#2e2e2e;--field:#161616;
  --accent:#fff;--on-accent:#000;--accent-soft:#1c1c1c;--learn:#8a8a8a;
  --ok:#4cc26a;--ok-bg:#12301b;--warn:#f0b04a;--warn-bg:#33260f;--bad:#ff6b5e;--bad-bg:#3a1512;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#000;--card:#000;--text:#fff;--muted:#9a9a9a;--line:#2e2e2e;--field:#161616;
  --accent:#fff;--on-accent:#000;--accent-soft:#1c1c1c;--learn:#8a8a8a;
  --ok:#4cc26a;--ok-bg:#12301b;--warn:#f0b04a;--warn-bg:#33260f;--bad:#ff6b5e;--bad-bg:#3a1512;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1.125rem/1.4 Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
h1{font-size:clamp(2.5rem,10vw,4rem);line-height:1;font-weight:700;margin:40px 0 16px;letter-spacing:-.02em}
h2{font-size:1.5rem;line-height:1.2;font-weight:700;margin:40px 0 16px}
.sub{font-size:1.25rem;font-weight:700;line-height:1.4;margin:0 0 8px}
.card{padding:20px 0;border-top:1px solid var(--line);margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
/* Top-Leiste und Brotkrumen */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:0.9375rem;font-weight:700}
.topbar a{color:var(--text);text-decoration:none}
.crumb{display:flex;gap:8px;align-items:center;min-width:0}
.crumb a{color:var(--muted);display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin-left:-6px}
.crumb span{color:var(--muted);font-weight:400}
.topbar svg,.ic{width:20px;height:20px;flex:none;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar .set{display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:44px;min-width:44px}
.crumb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){.topbar .set span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
/* Zahlen */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat{border-top:2px solid var(--text);padding-top:8px}
.stat b{display:block;font-size:2.5rem;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}

.btn{display:block;width:100%;min-height:52px;border:1.5px solid var(--text);border-radius:0;font-weight:700;padding:12px 18px;margin-bottom:8px;background:transparent;color:var(--text);text-align:left;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary::after{content:" →"}
.btn:not(:disabled):hover{background:var(--text);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible,.seg label:focus-within,input:focus-visible,.link:focus-visible,.acc button:focus-visible,.opt:focus-visible,.topic a:focus-visible,.topbar a:focus-visible,footer a:focus-visible,summary:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.hint{color:var(--muted);font-size:0.9375rem;margin:8px 0 0}
.seg{display:flex;border:1.5px solid var(--text)}

.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--text);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:0;padding:8px 12px;min-height:44px;font-size:1rem}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .st{margin-right:6px;font-size:0.75rem}
.row-head{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}
.row-head h2{margin:0}
.link{border:0;background:none;color:var(--text);font-weight:700;font-size:0.9375rem;padding:10px 4px;min-height:44px;min-width:44px;text-align:center;text-decoration:none;display:inline-block}
.link:hover{text-decoration:underline}
.legend{color:var(--muted);font-size:0.875rem;margin:12px 0 0}

.topic .head{display:flex;align-items:center;gap:16px}

.topic .btn{width:auto;min-height:44px;margin:0;padding:8px 16px;font-size:0.9375rem}
.topic .btn.primary::after{content:""}

.pbar .s{background:var(--text)}
.pbar .l{background:var(--learn)}
.plab{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:0.875rem;color:var(--muted);margin-top:6px}
.plab b{color:var(--text);font-variant-numeric:tabular-nums}
.prog.big .plab b{font-size:1.75rem}
.dot{display:inline-block;width:10px;height:10px;margin:0 6px 0 14px;vertical-align:-1px}
.dot:first-child{margin-left:0}
.dot.s{background:var(--text)}.dot.l{background:var(--learn)}.dot.n{background:var(--line)}
/* Formen m./w. */
.forms{display:flex;flex-wrap:wrap;gap:4px 20px;margin:10px 0 0;font-size:1.0625rem}
.forms .fl{color:var(--muted);font-size:.875rem;font-weight:700}
/* Karteikarte */
.flip{perspective:1400px;margin:0 0 20px;cursor:pointer;outline:none}
.flip.on{cursor:default}
.flip:focus-visible .face{outline:3px solid var(--text);outline-offset:3px}
.flip-in{display:grid;grid-template-columns:minmax(0,1fr);transition:transform .25s ease-out;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;min-width:0;min-height:300px;display:flex;flex-direction:column;gap:8px;padding:20px 24px 24px;border:1.5px solid var(--text);background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face>div{margin:auto 0}
.face .word{margin:0}
.face.back{transform:rotateY(180deg);background:var(--text);color:var(--bg)}
.side{font-size:0.8125rem;font-weight:700;color:var(--muted)}
.back .side,.back .qhint{color:var(--bg);opacity:.75}
.turn{font-size:0.875rem;color:var(--muted);min-height:1em}
.back .why{border-color:var(--bg);margin:16px 0 0}
.word.sm{font-size:1.75rem}
.fill{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.conj{border-collapse:collapse;margin-top:12px;font-size:1.125rem}
.conj td{padding:5px 20px 5px 0;border-bottom:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
.conj td:first-child{opacity:.75}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
/* Schnell-Optionen beim Lernen */
.quick{display:grid;gap:10px;margin:24px 0 20px}
.qrow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px}
.qlbl{font-size:0.875rem;font-weight:700;color:var(--muted)}
@media (max-width:360px){.qrow{grid-template-columns:1fr;gap:6px}}
/* Lernkartei */
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:4px}
@media (max-width:360px){.boxes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.boxbtn{display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:76px;padding:8px 6px;border:1.5px solid var(--text);border-radius:0;background:transparent;color:var(--text);text-align:left}
.boxbtn span{font-size:0.75rem;font-weight:700;color:var(--muted);overflow-wrap:anywhere}
.boxbtn b{font-size:clamp(1.125rem,5.6vw,1.625rem);line-height:1;font-variant-numeric:tabular-nums}
.boxbtn.done{background:var(--text);color:var(--bg)}
.boxbtn.done span{color:var(--bg);opacity:.75}
.boxbtn:not(:disabled):hover{background:var(--text);color:var(--bg)}
.boxbtn:not(:disabled):hover span{color:var(--bg)}
.boxbtn:disabled{border-color:var(--line);background:transparent;color:var(--text);cursor:default}
.boxbtn:disabled span{color:var(--muted);opacity:1}
.boxbtn:disabled b{color:var(--muted)}
.boxbtn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
/* Gliederung */
.header{display:block}
.section{margin-top:56px}
.section>h2:first-child,.section>.row-head:first-child{margin-top:0}
.section .card:last-child,.section .btn:last-child{margin-bottom:0}
.duehint{color:var(--muted);font-size:0.9375rem;margin:12px 0 0}
details summary .prog{margin:8px 0 2px;font-weight:400}
details summary .plab{font-size:0.8125rem}
/* Einstellungen */
.group{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow.col{display:block}
.setrow.col .seg{margin-top:12px}
.dt{font:inherit;font-size:1rem;color:var(--text);background:var(--field);border:0;border-bottom:2px solid var(--text);border-radius:0;padding:8px 10px;min-height:44px;max-width:60%}
.lbl{flex:1;min-width:0}
.lbl b{display:block;font-weight:700}
.lbl span{display:block;color:var(--muted);font-size:0.9375rem}
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);box-shadow:inset 0 0 0 1.5px var(--muted);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle:checked{background:var(--text);box-shadow:none}
.toggle:checked::after{transform:translateX(20px);background:var(--bg)}
.toggle:focus-visible{outline:3px solid var(--text);outline-offset:3px}
/* Erklärungen */
.ex h3{font-size:1.25rem;margin:28px 0 8px}
.ex h3:first-child{margin-top:0}
.ex p,.ex li{margin:0 0 10px}
.ex ul{padding-left:20px;margin:0 0 10px}
.ex table{border-collapse:collapse;width:100%;font-size:1rem;margin:4px 0 16px;overflow-wrap:anywhere}
.ex th,.ex td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ex th{font-size:0.875rem;color:var(--muted);font-weight:700}
.ex .note{border-left:3px solid var(--text);padding:4px 0 4px 14px;margin:12px 0 16px}
.ex b.k{text-decoration:underline;text-underline-offset:3px}
details{border-bottom:1px solid var(--line);padding:6px 0}
details summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px}
/* Üben */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{color:var(--muted);font-weight:700;font-size:0.9375rem;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--text);transition:width .3s}
.tense{color:var(--muted);font-size:0.9375rem;font-weight:700}
.word{font-size:clamp(2rem,8vw,3rem);font-weight:700;letter-spacing:-.02em;margin:8px 0 0;line-height:1.1;overflow-wrap:break-word;hyphens:auto}
.word.q{font-size:1.625rem;letter-spacing:0;line-height:1.3;hyphens:manual}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--text);text-align:center}
.qhint{color:var(--muted);font-size:0.9375rem;margin-top:8px}
.line{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.pr{width:84px;flex:none;color:var(--muted);text-align:right;font-weight:700}
.weak .pr::after{content:" •";color:var(--warn)}
input[type=text]{flex:1;min-width:0;width:100%;font:inherit;font-size:1.25rem;color:var(--text);background:var(--field);border:0;border-bottom:2px solid var(--text);border-radius:0;padding:10px 12px;min-height:48px}
input.ok{background:var(--ok-bg);border-color:var(--ok)}
input.warn{background:var(--warn-bg);border-color:var(--warn)}
input.bad{background:var(--bad-bg);border-color:var(--bad)}
.mark{width:22px;flex:none;font-weight:700;text-align:center}
.fix{font-size:0.9375rem;margin:-2px 0 6px 96px}
.fix.warn,.res.warn{color:var(--warn)}.fix.bad,.res.bad{color:var(--bad)}.res.ok{color:var(--ok)}
.weaknote{font-size:0.875rem;color:var(--muted);margin:8px 0 0}
.inf{display:flex;gap:8px;margin-top:16px}
.inf .btn{width:auto;margin:0}
.result{font-weight:700;margin:4px 0 12px}
.why{border-left:3px solid var(--text);padding:4px 0 4px 14px;margin:0 0 16px;font-size:1rem}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{margin:0;padding:8px 4px;font-size:0.9375rem;text-align:center}
.grades .btn::after{content:""}
.grades small{display:block;font-weight:400;opacity:.8;font-size:0.75rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:20px}
.opts.wide{grid-template-columns:1fr}
.opts.wide .opt{text-align:left;padding:10px 16px;font-size:1.0625rem}
.opt{min-height:52px;padding:8px 12px;border:1.5px solid var(--text);background:transparent;border-radius:0;font-size:1.125rem;font-weight:700;overflow-wrap:anywhere;hyphens:auto}
.opt:not(:disabled):hover{background:var(--text);color:var(--bg)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.sel{background:var(--text);color:var(--bg)}
.prow{margin-top:16px}
.why .grp{display:inline-block;margin-top:6px;font-size:.9375rem;color:var(--muted)}
.prow .opts{margin-top:6px}
#prepRows .opts{grid-template-columns:repeat(3,1fr)}
.opt:disabled{cursor:default}
.answer{margin-top:16px}
.acc{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.acc button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:0;background:var(--bg);font-size:1.1875rem}
.danger{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:0.9375rem}
.big{font-size:5rem;line-height:1;font-weight:700;margin:4px 0 0}
/* Fusszeile */
footer{max-width:720px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right)) calc(140px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font-size:0.875rem;color:var(--muted);border-top:1px solid var(--line)}
body:has(.top) footer{display:none}

footer a{color:var(--muted);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}

footer p{margin:0;display:flex;align-items:center;gap:8px;min-height:44px}
.legal a{color:var(--text)}
.legal h2{font-size:1.375rem;margin:32px 0 8px}
.legal p{margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.bar i,.toggle,.toggle::after{transition:none}}

.cd{text-align:center;padding:28px 0 32px;border-bottom:1px solid var(--line)}
.cd-lbl{display:block;font-size:0.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cd-num{display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,2vw,14px);margin-top:10px;font-variant-numeric:tabular-nums}

#cat{position:absolute;left:0;top:0;width:48px;height:32px;z-index:5;pointer-events:none;will-change:transform}

</head>

<script>
// ===== Vor dem Veröffentlichen ausfüllen =====
const OWNER={
  name:'Silvan Burkhard',

// ============================================

// ===================== DATEN =====================
// Verben: fr | de | Formen | konjugiert wie
const VERB_RAW=`regarder|anschauen|regarde,regardes,regarde,regardons,regardez,regardent|
acheter|kaufen|achète,achètes,achète,achetons,achetez,achètent|

pp:`<h3>Wozu?</h3>
<p>Das Participe présent ersetzt vor allem in geschriebenen Texten einen <b>Relativsatz mit qui</b> oder eine <b>Begründung</b>.</p>
<ul><li>Les jeunes <b>qui s'engagent</b> au CMJ … → Les jeunes <b>s'engageant</b> au CMJ …</li>
<li><b>Comme il était</b> malade, il est resté chez lui. → <b>Étant</b> malade, …</li></ul>
<h3>Bildung</h3>
<p>Nimm die <b>nous-Form</b> im Présent, streiche <b>-ons</b> und hänge <b>-ant</b> an.</p>
<table><tr><th>nous-Form</th><th>Participe présent</th></tr>
<tr><td>nous parl<b>ons</b></td><td>parl<b class="k">ant</b></td></tr>
<tr><td>nous choisiss<b>ons</b></td><td>choisiss<b class="k">ant</b></td></tr>
<tr><td>nous pren<b>ons</b></td><td>pren<b class="k">ant</b></td></tr>
<tr><td>nous commenç<b>ons</b></td><td>commenç<b class="k">ant</b></td></tr>
<tr><td>nous mange<b>ons</b></td><td>mange<b class="k">ant</b></td></tr></table>
<div class="note"><b>Nur drei Ausnahmen:</b> être → <b>étant</b> · avoir → <b>ayant</b> · savoir → <b>sachant</b></div>
<h3>Typische Fehler</h3>
<ul><li>Das Participe présent ist <b>unveränderlich</b>: les femmes parlant (nicht <s>parlantes</s>).</li>
<li>Bei reflexiven Verben bleibt das Pronomen: s'engager → <b>s'engageant</b>.</li></ul>`,

const VERBS=VERB_RAW.split('\n').map(l=>{const[fr,de,f,like]=l.split('|');return{fr,de,forms:f.split(','),like}});
const BY=Object.fromEntries(VERBS.map(v=>[v.fr,v]));
const PRON=['je','tu','il/elle','nous','vous','ils/elles'];
const pron=(v,i)=>v.forms.length===1?'il':i?PRON[i]:(/^[aeiouyhéèêâîô]/.test(v.forms[0])?"j'":'je');

const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/\s*\/\s*/g,'/').replace(/\s*,\s*/g,'/').replace(/\s+/g,' ').trim();
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const clean=s=>s.replace(/\([^)]*\)/g,'').replace(/\b(qn|qc)(\/(qn|qc))?\b/g,'').replace(/\s+/g,' ').trim().replace(/ faire$/,'').trim();
function judgeList(input,acc,half){
  const x=norm(clean(input)),A=acc.map(a=>norm(clean(a)));
  if(A.includes(x))return 0;
  if(x&&A.some(a=>strip(a)===strip(x)))return S.opt.strict?1:.5;
  if(half&&half.map(norm).includes(x))return .5;
  return 1;
}
const judge=(input,answer)=>judgeList(input,answer.split('/'));

const CARDS={}; // id -> {type, topic, ...}
// Bestimmter statt unbestimmter Artikel (und umgekehrt) – das Geschlecht muss stimmen.
function artVariants(alts,raw){
  const g=/\(m\./.test(raw)?'m':/\(f\./.test(raw)?'f':'';
  const V=/^[aeiouyhéèêâîôœ]/i,out=[];
  const swap=w=>{let m;
    if(m=w.match(/^le (.+)$/))return['un '+m[1]];
    if(m=w.match(/^la (.+)$/))return['une '+m[1]];
    if(m=w.match(/^les (.+)$/))return['des '+m[1]];
    if(m=w.match(/^des (.+)$/))return['les '+m[1]];
    if(m=w.match(/^un (.+)$/))return[V.test(m[1])?"l'"+m[1]:'le '+m[1]];
    if(m=w.match(/^une (.+)$/))return[V.test(m[1])?"l'"+m[1]:'la '+m[1]];
    if(m=w.match(/^l'(.+)$/))return g==='m'?['un '+m[1]]:g==='f'?['une '+m[1]]:['un '+m[1],'une '+m[1]];
    return[]};
  alts.map(clean).forEach(a=>{const parts=a.split('/');
    if(parts.length===1)out.push(...swap(a));
    else{const sw=parts.map(swap);if(sw.every(x=>x.length)){out.push(sw.map(x=>x[0]).join('/'));out.push(sw[0][0])}}});
  return out;
}
VERBS.forEach(v=>CARDS['v:'+v.fr]={type:'verb',topic:'verbs',v});
VOCAB_RAW.split('\n').forEach(l=>{
  const[fr,de]=l.split('|'),alts=fr.split(' ; '),disp=alts[0];
  const acc=[];alts.forEach(a=>{const c=clean(a);acc.push(c);if(c.includes('/'))acc.push(c.split('/')[0])});
  CARDS['w:'+disp]={type:'vocab',topic:'vocab',fr:disp,de,acc,art:artVariants(alts,fr)};
});
PAIR_RAW.split('\n').forEach(l=>{const[g,fr,de]=l.split('|');CARDS['p:'+fr]={type:'pair',topic:'comp',g,fr,de,acc:[fr]};

Object.entries(ITEMS).forEach(([t,list])=>list.forEach((it,i)=>CARDS[`i:${t}:${i}`]={type:'item',topic:t,...it,a:[].concat(it.a)}));
// Verknüpfung Vokabel <-> Verb-Ergänzung (gleiche Form)
const LINK={};
Object.entries(CARDS).forEach(([id,c])=>{if(c.type==='vocab'){const k=norm(clean(c.fr));Object.entries(CARDS).forEach(([id2,c2])=>{if(c2.type==='pair'&&!c2.prep&&norm(clean(c2.fr))===k){LINK[id]=id2;LINK[id2]=id}})}});

}

// ===================== SPACED REPETITION (vereinfachtes SM-2) =====================
// g: 0 Nochmals, 1 Schwer, 2 Gut, 3 Einfach
function nextIvl(c,g){return g===0?0:g===1?(c.reps?Math.max(1,c.ivl*1.2):1):g===2?(c.reps===0?1:c.reps===1?3:c.ivl*c.ease):(c.reps===0?3:c.ivl*c.ease*1.3)}
function schedule(id,g,mode){
  const c=card(id),now=Date.now();
  if(mode==='all'&&g>=2&&c.reps>0)return; // freies Üben schiebt nichts nach hinten
  if(g===0){c.lapses++;c.reps=0;c.ease=Math.max(1.3,c.ease-.2);c.ivl=0;c.due=now+6e4;return}
  c.ivl=nextIvl(c,g);
  if(g===1)c.ease=Math.max(1.3,c.ease-.15);
  if(g===3)c.ease+=.15;
  c.reps++;c.due=now+c.ivl*DAY;
}
function preview(id,g){
  const c=card(id);
  if(S.session.mode==='all'&&g>=2&&c.reps>0)return'unverändert';
  const d=Math.round(nextIvl(c,g));
  return g===0?'gleich nochmals':d===1?'1 Tag':d+' Tage';
}

function counts(ids){let due=0,neu=0,sure=0;ids.forEach(id=>{if(isDue(id))due++;const s=status(id);if(s==='new')neu++;if(s==='sure')sure++});return{due,neu,sure,learn:ids.length-neu-sure,total:ids.length}}
// Fortschrittsbalken: sicher | am Lernen | neu
function prog(ids,big){
  const c=counts(ids),t=c.total||1,pct=Math.round(c.sure/t*100);
  return`<span class="prog${big?' big':''}"><span class="pbar" role="img" aria-label="${pct} Prozent ${SURE()}: ${c.sure} ${SURE()}, ${c.learn} ${LEARNW()}, ${c.neu} neu"><i class="s" style="width:${c.sure/t*100}%"></i><i class="l" style="width:${c.learn/t*100}%"></i></span>
  <span class="plab" aria-hidden="true"><span><b>${pct} %</b> ${SURE()}</span><span>${c.sure} ${SURE()} · ${c.learn} ${LEARNW()} · ${c.neu} neu</span></span></span>`;
}

function nextDue(ids){if(FREE())return ids.length?'<p class="duehint">Du hast alle Karten zuletzt gewusst.</p>':'';if(BOX())return ids.length?'<p class="duehint">Alle Karten sind in Fach 5. Gelernt!</p>':'';const d=ids.map(id=>S.cards[id]&&S.cards[id].due).filter(Boolean);if(d.length<ids.length||!d.length)return'';

// ===================== SITZUNG =====================
function start(mode,tid,fach){
  if(FREE())return freeStart(mode,tid);
  if(BOX())return boxStart(mode,tid,fach);
  let ids=shuffle(cardsOf(tid).filter(id=>mode==='all'||isDue(id)));
  if(mode==='due'){ids.sort((a,b)=>(S.cards[a]?S.cards[a].due:Infinity)-(S.cards[b]?S.cards[b].due:Infinity));ids=ids.slice(0,ROUND())} // Wiederholungen zuerst
  if(!ids.length)return;
  S.session={mode,topic:tid,queue:ids,total:ids.length,done:0};save();
  if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  next_();
}
function boxStart(mode,tid,fach){
  let ids=cardsOf(tid);
  if(fach!==undefined)ids=ids.filter(id=>Math.min(5,boxOf(id))===fach);
  else if(mode==='due')ids=ids.filter(id=>boxOf(id)<5);
  const order=[1,0,2,3,4,5]; // zuerst Fach 1, dann neue Karten, dann die höheren Fächer
  ids=shuffle(ids).sort((a,b)=>order.indexOf(Math.min(5,boxOf(a)))-order.indexOf(Math.min(5,boxOf(b))));
  if(mode==='due'&&fach===undefined)ids=ids.slice(0,ROUND());
  if(!ids.length)return;
  S.session={mode:'box',topic:tid,queue:ids,total:ids.length,done:0,seen:{}};save();
  if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  next_();
}
// Ziel-Fach: richtig → +1, nur Akzent/Kleinigkeit → bleibt, falsch → Fach 1.
// Wird eine Karte in derselben Runde wiederholt, wandert sie nicht mehr.
function boxTarget(err){
  const b=Math.max(1,boxOf(cur.id));
  if(S.session.seen[cur.id])return b;
  return err===0?Math.min(5,b+1):err<=.5?b:1;
}
// Ohne Algorithmus: zufällige Reihenfolge, «due» = nur die zuletzt nicht gewussten
function freeStart(mode,tid){
  let ids=cardsOf(tid);
  if(mode==='due')ids=ids.filter(id=>S.free[id]===0);
  ids=shuffle(ids);if(!ids.length)return;
  S.session={mode:'free',topic:tid,queue:ids,total:ids.length,done:0,seen:{}};save();
  if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  next_();
}
// Antwort sofort in der Lernkartei bzw. im freien Üben vermerken (schon beim Prüfen, nicht erst bei «Weiter»)
function applyAnswer(err){
  if(cur.applied)return;
  const s=S.session,id=cur.id;
  if(s.mode==='box')S.box[id]=boxTarget(err);
  else if(!s.seen[id])S.free[id]=err<=.5?1:0;
  s.seen[id]=1;cur.applied=true;save();
}
function nextCard(err){
  if(cur.phase!=='checked')return;
  applyAnswer(err);
  const s=S.session,id=cur.id;cur.phase='done';s.queue.shift();
  if(err>.5)s.queue.push(id);else s.done++;
  save();next_();
}
const freeNext=nextCard,boxNext=nextCard;
function startExam(){
  // S.opt.examLen Aufgaben, möglichst gleichmässig über die Lernziele verteilt
  const pools=TOPICS.map(t=>shuffle(cardsOf(t.id))).filter(p=>p.length);const q=[];
  for(let i=0;q.length<S.opt.examLen&&pools.some(p=>p.length);i++){const p=pools[i%pools.length];if(p.length)q.push(p.pop())}
  S.session={mode:'exam',exam:true,queue:shuffle(q),total:q.length,done:0,pts:0,max:0,weak:{}};save();next_();
}
let cur=null;
function next_(){
  const s=S.session;
  if(!s||!s.queue.length){const t=s;S.session=null;save();return done(t)}
  const id=s.queue[0],c=CARDS[id];
  let dir=S.dir==='mix'?(Math.random()<.5?'de':'fr'):S.dir;
  if(c.type==='vocab'&&s.exam)dir='de';
  cur={id,c,dir,phase:'ask',infErr:0,errors:0};
  if(c.type==='verb')cur.phase='inf'; // DE→FR: Infinitiv eintippen, FR→DE: Bedeutung eintippen, danach konjugieren
  render();
}
function frame(label,promptHtml,body){
  const s=S.session;
  return`<div class="top"><button class="link" id="quit">‹ Beenden</button><span class="count">${s.done} / ${s.total}</span></div>
  <div class="bar"><i style="width:${s.done/s.total*100}%"></i></div>
  <section class="card"><div class="tense">${label}</div>${promptHtml}<div id="inf"></div></section>${body}
  <div id="actions"></div>`;
}
const ACC=()=>!S.opt.accBar?'':`<div class="acc" aria-label="Akzente">${'é è ê ë à â ç î ï ô û ù œ'.split(' ').map(a=>`<button tabindex="-1" data-a="${a}">${a}</button>`).join('')}</div>`;
const INPUT=(id,label,hint)=>`<input type="text" id="${id}" lang="fr" aria-label="${label}" placeholder="${label}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${hint||'done'}">`;

function render(){

    app.innerHTML=frame(lab,`<h1 class="word" lang="de">${esc(c.de)}</h1><p class="qhint">${hint}</p>`,`<div class="answer card">${INPUT('ans','Auf Französisch')}<div id="fix"></div></div>`)+ACC();

  }else{ // item
    const body=c.o?`<div class="opts${c.o.some(o=>o.length>10)?' wide':''}">${c.o.map((o,i)=>`<button class="opt" data-o="${esc(o)}" lang="fr">${esc(o)}</button>`).join('')}</div>`
      :`<div class="answer card">${INPUT('ans','Deine Antwort')}<div id="fix"></div></div>`;
    app.innerHTML=frame(t,`<p class="word q" lang="fr">${gapify(c.q)}</p>${c.h?`<p class="qhint">${esc(c.h)}</p>`:''}`,body)+(c.o?'':ACC());
    if(c.o){app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>checkSingle(b.dataset.o));app.querySelector('.opt').focus()}
    else{$('actions').innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;$('chk').onclick=()=>checkSingle();$('ans').focus()}
  }
  wire();
}
// ----- Karteikarte mit Vorder- und Rückseite -----
// Männliche und weibliche Form (bei «le mien …» alle vier) nebeneinander zeigen
function forms(c){
  if(c.type!=='vocab'||!c.fr.includes('/')||/\bq[cn]\b/.test(c.fr))return'';
  const p=c.fr.split('/'),L=p.length===2?['männlich','weiblich']:p.length===4?['m. Sg.','w. Sg.','m. Pl.','w. Pl.']:null;
  if(!L)return'';
  return`<p class="forms">${p.map((x,i)=>`<span><span class="fl">${L[i]}</span> <b lang="fr">${esc(x.trim())}</b></span>`).join('')}</p>`;
}
function renderFlip(){
  const {c,dir}=cur,t=TOP[c.topic].title;
  cur.flip=true;cur.phase='ask';
  let fl,front,bl,back;

    else{fl='Deutsch';front=`<p class="word" lang="de">${de}</p>${c.type==='pair'?'<p class="qhint">Verb mit Ergänzung</p>':''}`;bl='Französisch';back=`<p class="word" lang="fr">${fr}</p><p class="qhint" lang="de">${de}</p>${forms(c)}`}
  }else if(c.type==='verb'){
    const v=c.v;
    fl=dir==='de'?'Deutsch':'Französisch';
    front=dir==='de'?`<p class="word" lang="de">${esc(v.de)}</p><p class="qhint">Infinitiv und Présent</p>`:`<p class="word" lang="fr">${esc(v.fr)}</p><p class="qhint">Konjugiere im Présent</p>`;
    front=dir==='de'?front:`<p class="word" lang="fr">${esc(v.fr)}</p><p class="qhint">Was heisst das? Und wie geht es im Présent?</p>`;
    bl=dir==='de'?'Infinitiv und Présent':'Bedeutung und Présent';
    back=(dir==='de'?`<p class="word sm" lang="fr">${esc(v.fr)}</p><p class="qhint">${esc(v.de)}${v.like?` · wie ${esc(v.like)}`:''}</p>`
      :`<p class="word sm" lang="de">${esc(v.de)}</p><p class="qhint" lang="fr">${esc(v.fr)}${v.like?` · wie ${esc(v.like)}`:''}</p>`)+`
      <table class="conj" lang="fr">${v.forms.map((f,i)=>`<tr><td>${pron(v,i)}</td><td><b>${esc(f.replace(/\//g,' / '))}</b></td></tr>`).join('')}</table>`;
  }else{
    const a=c.a[0];
    fl='Aufgabe';front=`<p class="word q" lang="fr">${gapify(c.q)}</p>${c.h?`<p class="qhint">${esc(c.h)}</p>`:''}`;
    let sol;
    if(!c.q.includes('___'))sol=`<p class="word q" lang="fr">${esc(c.q)}</p><p class="word sm"><b class="fill">${esc(a)}</b></p>`;
    else if(a==='—')sol=`<p class="word q" lang="fr">${esc(c.q).replace(/\s*___\s*/,' ')}</p><p class="qhint">Keine Präposition</p>`;
    else sol=`<p class="word q" lang="fr">${esc(c.q).replace('___',`<b class="fill">${esc(a)}</b>`)}</p>`;
    bl='Lösung';back=sol+(c.w?`<div class="why">${c.w}</div>`:'');
  }

    <div class="flip-in"><div class="face front"><span class="side">${fl}</span><div>${front}</div><span class="turn">Tippen oder Leertaste zum Umdrehen</span></div>
    <div class="face back" aria-hidden="true"><span class="side">${bl}</span><div>${back}</div><span class="turn"></span></div></div></div>`);
  wire();
  $('actions').innerHTML=`<button class="btn primary" id="turn">Umdrehen</button>`;
  $('flip').onclick=flipCard;$('turn').onclick=flipCard;$('flip').focus();
}
function flipCard(){
  if(!cur||!cur.flip||cur.phase!=='ask')return;
  const f=$('flip');f.classList.add('on');f.removeAttribute('role');f.removeAttribute('tabindex');f.removeAttribute('aria-label');
  f.querySelector('.front').setAttribute('aria-hidden','true');f.querySelector('.back').removeAttribute('aria-hidden');
  showGrades(null,'Wusstest du es?','');
}
// Nach dem Üben zurück zur Seite, von der man kam: Thema oder Startseite
function leaveTo(t){
  cur=null;const ok=t&&TOP[t];
  try{history.replaceState(null,'',ok?'#t-'+t:location.pathname+location.search)}catch(e){}
  ok?topicPage(t):home();scrollTo(0,0);
}
// ----- Compléments: nur die Präposition abfragen -----
// Vor jeder Ergänzung (qn, qc, qn/qc, faire) eine Lücke: Antwort ist à, de oder «—» (direkt).
// So muss man entscheiden, welche Ergänzung direkt ist und welche eine Präposition braucht.
// Was nach «faire» steht, gehört zum Infinitiv und bekommt keine Lücke.
function prepSlots(fr){
  const t=fr.split(' '),parts=[],ans=[],objs=[],OBJ=/^(qn|qc|qn\/qc|faire)$/;
  for(let i=0;i<t.length;i++){
    let w=t[i],pre='—';
    if(/^(à|de|d')$/.test(w)&&OBJ.test(t[i+1]||'')){pre=w;w=t[++i]}
    else if(!(i>0&&OBJ.test(w))){parts.push(w);continue}
    ans.push(pre);objs.push(w);parts.push(null,w);
    if(w==='faire'){parts.push(...t.slice(i+1));break}
  }
  return{parts,ans,objs};
}
function prepHtml(p,fill){let k=0;return p.parts.map(w=>w===null?(fill?fill(k++):(k++,'<span class="gap">&nbsp;</span>')):esc(w)).join(' ')}
const NONE=['','-','—','–','x','0','/','ø','keine','kein','keins','nichts'];
function renderPrep(){
  const {c}=cur,t=TOP[c.topic].title,p=cur.prep=prepSlots(c.fr),mode=S.opt.answer,n=p.ans.length;
  cur.phase='ask';
  const prompt=`<p class="qhint" lang="de" style="margin-top:4px">${esc(c.de)}</p><p class="word q" lang="fr" id="pq">${prepHtml(p)}</p>`;
  if(mode==='flip'){
    cur.flip=true;
    app.innerHTML=frame(`${t} · Nur Präposition`,'',`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="flip-in">
      <div class="face front"><span class="side">Welche Präposition?</span><div>${prompt}</div><span class="turn">Tippen oder Leertaste zum Umdrehen</span></div>
      <div class="face back" aria-hidden="true"><span class="side">Lösung</span><div><p class="word q" lang="fr">${prepHtml(p,k=>`<b class="fill">${esc(p.ans[k])}</b>`)}</p><p class="qhint">${esc(c.de)}</p></div><span class="turn"></span></div></div></div>`);
    wire();$('actions').innerHTML=`<button class="btn primary" id="turn">Umdrehen</button>`;
    $('flip').onclick=flipCard;$('turn').onclick=flipCard;$('flip').focus();return;
  }
  const body=mode==='choice'
    ?`<div id="prepRows">${p.ans.map((_,k)=>`<div class="prow">${n>1?`<span class="qlbl">Vor «${esc(p.objs[k])}»</span>`:''}<div class="opts" data-k="${k}">${['—','à','de'].map(o=>`<button class="opt" data-o="${o}" lang="fr">${o==='—'?'— keine':o}</button>`).join('')}</div></div>`).join('')}</div>`
    :`<div class="answer card">${p.ans.map((_,k)=>`<div class="line"><label class="pr" for="pg${k}">vor ${esc(p.objs[k])}</label>${INPUT('pg'+k,'à, de oder leer',k<n-1?'next':'done')}</div>`).join('')}<p class="hint">Leer lassen oder «–» schreiben, wenn keine Präposition hingehört.</p></div>`;
  app.innerHTML=frame(`${t} · Nur Präposition`,prompt,body)+(mode==='choice'?'':ACC());
  wire();
  if(mode==='choice'){
    cur.picks=[];
    app.querySelectorAll('#prepRows .opts').forEach(g=>g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(cur.phase!=='ask')return;const k=+g.dataset.k;cur.picks[k]=b.dataset.o;
      g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
      if(p.ans.every((_,i)=>cur.picks[i]!==undefined))checkPrep(cur.picks)}));
    app.querySelector('.opt').focus();
  }else{
    const vals=()=>p.ans.map((_,k)=>$('pg'+k).value);
    $('actions').innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;$('chk').onclick=()=>checkPrep(vals());
    p.ans.forEach((_,k)=>$('pg'+k).onkeydown=e=>{if(e.key!=='Enter'||cur.phase!=='ask')return;e.preventDefault();e.stopPropagation();const nx=$('pg'+(k+1));nx?nx.focus():checkPrep(vals())});
    $('pg0').focus();
  }
}
function checkPrep(vals){
  if(cur.phase!=='ask')return;
  const {c}=cur,p=cur.prep;
  const res=p.ans.map((a,k)=>{const v=norm(vals[k]||'');return a==='—'?(NONE.includes(v)?0:1):judgeList(v,[a])});
  const err=res.reduce((x,y)=>x+y,0),cls=x=>x===0?'ok':x<1?'warn':'bad';
  cur.errors=err;cur.phase='checked';
  $('pq').innerHTML=prepHtml(p,k=>`<b class="fill res ${cls(res[k])}">${esc(p.ans[k])}</b>`);
  if(S.opt.answer==='choice')app.querySelectorAll('#prepRows .opts').forEach(g=>{const k=+g.dataset.k;g.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('sel');if(b.dataset.o===p.ans[k])b.classList.add('ok');else if(b.dataset.o===cur.picks[k])b.classList.add('bad')})});
  else p.ans.forEach((_,k)=>{const i=$('pg'+k);i.readOnly=true;i.className=cls(res[k])});
  const msg=err===0?'✓ Richtig':err<1?'~ Fast: Akzent beachten':'✗ Falsch';
  const grp=PAIR_GROUPS.find(x=>x[0]===c.g);

const REL_OPTS=['qui','que','où','dont','ce qui','ce que','lequel','laquelle','lesquels','lesquelles','auquel','auxquels','auxquelles','duquel'];
const POSS_OPTS=['le mien','la mienne','les miens','les miennes','le tien','la tienne','les tiens','les tiennes','le sien','la sienne','les siens','les siennes','le nôtre','la nôtre','les nôtres','le vôtre','la vôtre','les vôtres','le leur','la leur','les leurs'];
function choicesFor(c,dir){
  // Richtige Antwort + zufällige falsche; bei festen Listen in der Reihenfolge der Liste
  const pick=(list,right,n,keep)=>{const o=shuffle([...new Set(list.filter(x=>x&&x!==right))]).slice(0,n).concat(right);return keep?o.sort((a,b)=>list.indexOf(a)-list.indexOf(b)):shuffle(o)};
  if(c.type==='item'){
    if(c.o)return{opts:c.o,acc:c.a};
    const a=c.a[0];
    const fill=(must,list,n)=>{const o=[...new Set([...must,a])];shuffle(list.filter(x=>!o.includes(x))).slice(0,Math.max(0,n-o.length)).forEach(x=>o.push(x));return o.sort((x,y)=>list.indexOf(x)-list.indexOf(y))};
    // Relativpronomen: qui, que, où, dont sind immer dabei
    if(c.topic==='rel')return{opts:fill(['qui','que','où','dont'],REL_OPTS,6),acc:c.a};
    // Possessivpronomen: alle Formen derselben Person, dazu zwei andere
    if(c.topic==='poss'){const grp=POSS_OPTS.filter(x=>x.split(' ')[1].replace(/(nne|n|ns|nnes|e|es|s)$/,'')===a.split(' ')[1].replace(/(nne|n|ns|nnes|e|es|s)$/,''));return{opts:fill(grp,POSS_OPTS,grp.length+2),acc:c.a}}
    return{opts:pick(Object.values(CARDS).filter(x=>x.type==='item'&&x.topic===c.topic&&!x.o).map(x=>x.a[0]),a,3),acc:c.a};
  }
  const same=Object.values(CARDS).filter(x=>x.type===c.type);
  if(dir==='fr')return{opts:pick(same.map(x=>x.de),c.de,3),acc:[c.de],lang:'de',wide:true};
  return{opts:pick(same.map(x=>x.fr),c.fr,3),acc:[c.fr],lang:'fr',wide:true};
}

const Cat=(()=>{
  const BODY='M12 19C11.5 14.5 15 12.6 20 13.2C25 13.8 30 12.6 33.5 15C35.5 17 35 21.5 32 23.5C29 25 18 25 15.5 24C13 23 12.2 21 12 19Z';
  const SVG=`<g class="pose" data-p="stand"><path class="n tl"/><path class="n lg"/><g class="bd"><path class="f" d="${BODY}"/><g class="hd"><path class="f" d="M32.6 8.6L33 2.6L36.4 6.4L39.6 6.4L42 2.6L42.4 8.6A6 6 0 1 1 32.6 8.6Z"/><circle class="e" cx="39.6" cy="11.4" r=".9"/></g></g></g>
    <g class="pose" data-p="sit"><path class="n tl"/><path class="f" d="M14 31C12 24 14 15 22 14C27 14 29 19 30 24L30 31Z"/><path class="n" d="M26 21L26 31"/><g class="hd"><path class="f" d="M22.6 6.6L23 0.6L26.4 4.4L29.6 4.4L32 0.6L32.4 6.6A6 6 0 1 1 22.6 6.6Z"/><circle class="e ey" cx="29.4" cy="9.4" r=".9"/><path class="n cl" d="M28.4 9.6Q29.4 10.4 30.4 9.6"/></g></g>
    <g class="pose" data-p="sleep"><path class="n" d="M11 30.5C11 33 24 33 29 31"/><g class="br"><path class="f" d="M10 31C8 25 13 20 22 20C31 20 36 24 36 31Z"/><path class="f" d="M29 23.2L29.4 18.4L32.4 21.4L34.6 21.4L37.6 18.4L38 23.2A5.4 5.4 0 1 1 29 23.2Z"/><path class="n" d="M33 26.2Q34 27 35 26.2"/></g></g>`;
  const HIPS=[15,19,28,32],OFF=[0,Math.PI,Math.PI,0],TAU=Math.PI*2;
  let el,svg,R={},st=null,raf=0,now=0,obs=false;
  const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const lesson=()=>!!cur;
  const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

  // ---- Sitzplätze: Überschriften (Textbreite), Linie unter dem Countdown, beim Lernen die Aufgabenkarte
  function edge(e){
    if(!e||!e.isConnected)return null;let r=e.getBoundingClientRect(),y;
    if(/^H[12]$/.test(e.tagName)){const g=document.createRange();g.selectNodeContents(e);r=g.getBoundingClientRect();y=r.top+(e.tagName==='H1'?8:4)}
    else y=e.classList.contains('cd')?r.bottom:r.top;
    if(!r.width)return null;
    let x1=r.left+scrollX,x2=r.right+scrollX-48;
    if(e.matches('section.card'))x1=Math.max(x1,x2-70); // beim Lernen nur rechts am Rand
    return{x1,x2:Math.max(x1,x2),y:y+scrollY};
  }
  const inView=p=>{const v=p.y-scrollY;return v>70&&v<innerHeight-20};
  function perches(){
    const sel=lesson()?'#app section.card':'#app .cd,#app h1,#app section>h2';
    return[...app.querySelectorAll(sel)].map(e=>({e,...edge(e)})).filter(p=>p.y!==undefined&&!isNaN(p.y));
  }
  function nearestVisible(exclude){
    const P=perches().filter(p=>inView(p)&&p.e!==exclude);
    P.sort((a,b)=>Math.abs(a.y-st.y)-Math.abs(b.y-st.y));return P[0];
  }

  // ---- Zustände
  function set(mode,dur){st.mode=mode;st.t0=now;st.until=now+(dur||0)}
  function face(d){if(d&&d!==st.dir){st.dir=d;el.classList.toggle('left',d<0);return true}return false}
  function sit(min,max){set('sit',rnd(min||3000,max||7000))}
  function walkTo(tx){st.tx=tx;if(face(Math.sign(tx-st.x))&&!RM())set('turn',220);else set('walk')}
  function jumpTo(e){const p=edge(e);if(!p)return sit();
    face(Math.sign((p.x1+p.x2)/2-st.x)||st.dir);
    st.j={e,x0:st.x,y0:st.y,x1:rnd(p.x1,p.x2),dur:Math.min(800,420+Math.hypot(p.y-st.y,(p.x1+p.x2)/2-st.x)*.6)};
    set('crouch',240)}
  function enter(e){ // von links hereinspazieren
    const p=edge(e);if(!p)return;st.e=e;st.y=p.y;st.x=Math.min(-50,scrollX-50);el.style.opacity=1;face(1);st.v=20;st.tx=rnd(p.x1,p.x2);set('walk')}
  function relocate(direct){
    const target=nearestVisible()||perches()[0];
    if(!target){el.style.opacity=0;set('wait',800);return}
    if(RM()||direct){const p=edge(target.e);st.e=target.e;st.x=rnd(p.x1,p.x2);st.y=p.y;el.style.opacity=1;return sit(2000,5000)}
    const onScreen=st.y-scrollY>-40&&st.y-scrollY<innerHeight+40;
    if(onScreen&&Math.abs(target.y-st.y)<280)jumpTo(target.e);else enter(target.e);
  }
  function decide(){
    const p=edge(st.e);if(!p)return relocate();
    if(lesson()){if(!st.e.matches('section.card'))return relocate(true);
      return Math.random()<.25?set('sleep',rnd(12e3,22e3)):sit(5000,10000)}
    if(!inView(p))return relocate();
    const sat=now-st.since>25e3,r=Math.random();
    if(RM())return sat&&r<.3?set('sleep',rnd(15e3,30e3)):sit(4000,9000);
    if(r<.42&&p.x2-p.x1>40){let tx=rnd(p.x1,p.x2),n=0;while(Math.abs(tx-st.x)<30&&n++<5)tx=rnd(p.x1,p.x2);return walkTo(tx)}
    if(r<.62){const o=nearestVisible(st.e);if(o&&Math.abs(o.y-st.y)<280)return jumpTo(o.e)}
    if(sat&&r<.8){st.since=now;return set('sleep',rnd(14e3,28e3))}
    sit(3000,8000);
  }

  // ---- Zeichnen
  let shown=null;
  function pose(n){if(shown===n)return;shown=n;svg.querySelectorAll('.pose').forEach(g=>g.style.opacity=g.dataset.p===n?1:0)}
  function standLegs(amp,lift,crouch,spread){
    R.lg.setAttribute('d',HIPS.map((h,i)=>{const a=st.phase+OFF[i];
      const dx=spread?(i<2?-3.5:3.5)*spread:Math.sin(a)*amp,up=spread?2*spread:Math.max(0,Math.cos(a))*lift;
      return`M${h} ${23.5+crouch}L${(h+dx).toFixed(2)} ${(31-up).toFixed(2)}`}).join(''));
    R.bd.setAttribute('transform',`translate(0 ${crouch.toFixed(2)})`);
  }
  function draw(){
    const t=now,m=st.mode,still=RM();
    const sway=still?0:Math.sin(t/700);
    if(m==='sleep'){pose('sleep');R.br.setAttribute('transform',still?'':`translate(0 31) scale(1 ${(1+.035*Math.sin(t/650)).toFixed(4)}) translate(0 -31)`)}
    else if(m==='sit'||m==='wait'){pose('sit');
      const w=sway*1.1;R.st.setAttribute('d',`M15 30C${(9+w).toFixed(2)} 31.5 ${(4+w).toFixed(2)} 30 ${(5+w*.7).toFixed(2)} ${(25-Math.abs(w)*.4).toFixed(2)}`);
      const b=(t%4300)<130;R.ey.style.opacity=b?0:1;R.cl.style.opacity=b?1:0}
    else{pose('stand');
      const happy=m==='happy',wag=happy?Math.sin(t/140)*1.6:sway*.8;
      R.tl.setAttribute('d',happy?`M12 16C8 12 ${(9+wag).toFixed(2)} 6 ${(7+wag).toFixed(2)} 2`:`M12 17C${(6+wag).toFixed(2)} 16 ${(4+wag*.6).toFixed(2)} 11 ${(6+wag).toFixed(2)} ${(6+Math.abs(wag)*.3).toFixed(2)}`);
      const k=Math.min(1,(t-st.t0)/Math.max(1,st.until-st.t0));
      if(m==='crouch')standLegs(0,0,1.6*ease(k),0);
      else if(m==='land')standLegs(0,0,1.6*(1-ease(k)),0);
      else if(m==='air')standLegs(0,0,0,Math.sin(Math.PI*k));
      else{const amp=Math.min(1,st.v/22)*2.2;standLegs(amp,amp*.75,0,0);
        R.hd.setAttribute('transform',`translate(0 ${(-Math.abs(Math.sin(st.phase))*amp*.18).toFixed(2)})`)}
    }
    el.style.transform=`translate3d(${st.x.toFixed(2)}px,${(st.y-31).toFixed(2)}px,0)`;
  }

  // ---- Schleife
  function tick(t){
    raf=requestAnimationFrame(tick);
    const dt=Math.min(50,t-(now||t))/1000;now=t;
    if(document.hidden||!st)return;
    const m=st.mode;
    if(m==='air'){const j=st.j,k=Math.min(1,(t-st.t0)/j.dur),p=edge(j.e);if(!p){relocate(true);return draw()}
      const e=ease(k);st.x=j.x0+(j.x1-j.x0)*e;st.y=j.y0+(p.y-j.y0)*e-(30+Math.min(60,Math.abs(p.y-j.y0)*.25))*4*k*(1-k);
      if(k>=1){st.e=j.e;st.y=p.y;st.x=j.x1;set('land',170)}
      return draw()}
    if(m==='wait'){if(t>st.until)relocate(true);return}
    const p=edge(st.e);if(!p){relocate(!lesson()&&false);return draw()}
    st.y=p.y;
    if(m==='walk'){
      const d=st.tx-st.x,dist=Math.abs(d),a=90,vmax=36;
      const target=Math.min(vmax,Math.sqrt(2*a*dist));st.v=st.v<target?Math.min(target,st.v+a*dt):target;
      const step=st.v*dt;
      if(dist<=Math.max(step,.3)){st.x=st.tx;st.v=0;sit(2500,7000)}
      else{st.x+=Math.sign(d)*step;st.phase+=step*TAU/11}
    }else{st.x=Math.min(Math.max(st.x,p.x1),p.x2)}
    if(m==='turn'&&t>st.until){st.v=0;set('walk')}
    else if(m==='crouch'&&t>st.until)set('air',st.j.dur);
    else if(m==='land'&&t>st.until){st.since=st.since||t;sit(2500,6000)}
    else if((m==='sit'||m==='sleep'||m==='happy')&&t>st.until)decide();
    draw();
  }
  function fx(txt){const f=document.createElement('span');f.className='fx';f.textContent=txt;el.appendChild(f);setTimeout(()=>f.remove(),1700)}
  function pet(){if(!st)return;if(st.mode==='sleep'){fx('?!');st.since=now;return sit(3000,6000)}fx('♥');if(st.mode==='sit')set('happy',1500)}
  function cheer(){if(st&&(st.mode==='sit'||st.mode==='sleep'))set('happy',1600)}
  function sync(){
    if(S.opt.cat&&!el){
      el=document.createElement('div');el.id='cat';el.setAttribute('aria-hidden','true');el.style.opacity=0;
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 48 32');svg.innerHTML=SVG;el.appendChild(svg);
      const q=s=>svg.querySelector(s);
      R={tl:q('[data-p=stand] .tl'),lg:q('.lg'),bd:q('.bd'),hd:q('[data-p=stand] .hd'),st:q('[data-p=sit] .tl'),ey:q('.ey'),cl:q('.cl'),br:q('.br')};
      svg.addEventListener('click',pet);document.body.appendChild(el);
      st={x:0,y:0,e:null,mode:'wait',t0:0,until:0,dir:1,phase:0,v:0,since:performance.now()};
      now=performance.now();relocate(true);draw();raf=requestAnimationFrame(tick);
      if(!obs)obs=new MutationObserver(()=>{if(!st)return;
        if(app.querySelector('.res.ok:not([data-cat])')){app.querySelectorAll('.res.ok').forEach(e=>e.dataset.cat=1);cheer()}
        if(st.e&&!st.e.isConnected&&st.mode!=='air'){st.e=null;el.style.opacity=0;set('wait',350)}}).observe(app,{childList:true,subtree:true})||true;
    }else if(!S.opt.cat&&el){cancelAnimationFrame(raf);el.remove();el=null;st=null}
  }
  return{sync};
})();

function route(){
  const k=location.hash.slice(1);
  scrollTo(0,0);
  if(LEGAL[k])return legal(k);
  if(k==='einstellungen')return settings();
  if(k.startsWith('t-')&&TOP[k.slice(2)])return topicPage(k.slice(2));
  home();
}
addEventListener('hashchange',route);
route();
Cat.sync();
</script>
</body>
</html>
