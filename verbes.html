<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbes – Konjugationstrainer</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --accent:#6b4a7a;--on-accent:#fff;--accent-soft:#efe8f3;
  --ok:#1a7f37;--ok-bg:#e6f4ea;--warn:#8a5200;--warn-bg:#fff4e0;--bad:#c4271c;--bad-bg:#fdecea;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#3a3a3c;
  --accent:#c3a2d4;--on-accent:#1d1020;--accent-soft:#2e2235;
  --ok:#4cc26a;--ok-bg:#12301b;--warn:#f0b04a;--warn-bg:#33260f;--bad:#ff6b5e;--bad-bg:#3a1512;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:34px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:28px 4px 8px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;font-weight:600;padding:12px 16px;margin-bottom:8px;background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.seg label:focus-within,input:focus-visible,.link:focus-visible,.acc button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:15px;margin:4px 4px 0}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px}
.seg label{flex:1;text-align:center;padding:9px 4px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;min-height:40px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:40px;font-size:16px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .st{margin-right:6px;font-size:12px}
.row-head{display:flex;justify-content:space-between;align-items:center;margin:28px 4px 8px}
.row-head h2{margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:8px 4px;min-height:40px}
.legend{color:var(--muted);font-size:14px;margin:10px 4px 0}
/* drill */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tense{color:var(--muted);font-size:15px}
.word{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0}
.line{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.pr{width:84px;flex:none;color:var(--muted);text-align:right}
.weak .pr::after{content:" •";color:var(--warn)}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:19px;color:var(--text);background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;min-height:46px}
input.ok{background:var(--ok-bg);border-color:var(--ok)}
input.warn{background:var(--warn-bg);border-color:var(--warn)}
input.bad{background:var(--bad-bg);border-color:var(--bad)}
.mark{width:22px;flex:none;font-weight:700;text-align:center}
.fix{font-size:15px;margin:-2px 0 6px 96px}
.fix.warn{color:var(--warn)}.fix.bad{color:var(--bad)}
.weaknote{font-size:14px;color:var(--muted);margin:8px 0 0}
.inf{display:flex;gap:8px;margin-top:16px}
.inf .btn{width:auto;margin:0}
.result{font-weight:600;margin:4px 4px 10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{margin:0;padding:8px 4px;font-size:15px}
.grades small{display:block;font-weight:400;opacity:.8;font-size:12px}
.acc{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.acc button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:var(--bg);font-size:19px}
.danger{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
footer{max-width:600px;margin:0 auto;padding:0 16px 140px;color:var(--muted);font-size:15px;display:flex;gap:20px}
footer a,.legal a{color:var(--accent)}
.legal h2{text-transform:none;letter-spacing:0;font-size:20px;color:var(--text);margin:28px 0 8px}
.legal p,.legal li{margin:0 0 10px}
.legal ul{padding-left:20px}
</style>
</head>
<body>
<main id="app"></main>
<footer><a href="#datenschutz">Datenschutz</a></footer>
<script>
// ===== Vor dem Veröffentlichen ausfüllen =====
const OWNER={
  name:'[Vorname Nachname]',
  email:'[E-Mail-Adresse]',
  host:'[Name des Hosting-Anbieters]',
  hostCountry:'[Land des Servers, z. B. Schweiz]',
};
// ============================================
const RAW=`regarder|anschauen|regarde,regardes,regarde,regardons,regardez,regardent
acheter|kaufen|achète,achètes,achète,achetons,achetez,achètent
préférer|bevorzugen, lieber mögen|préfère,préfères,préfère,préférons,préférez,préfèrent
appeler|rufen, anrufen|appelle,appelles,appelle,appelons,appelez,appellent
essayer|versuchen|essaie/essaye,essaies/essayes,essaie/essaye,essayons,essayez,essaient/essayent
commencer|anfangen|commence,commences,commence,commençons,commencez,commencent
répondre|antworten|réponds,réponds,répond,répondons,répondez,répondent
dormir|schlafen|dors,dors,dort,dormons,dormez,dorment
choisir|wählen|choisis,choisis,choisit,choisissons,choisissez,choisissent
craindre|fürchten|crains,crains,craint,craignons,craignez,craignent
aller|gehen|vais,vas,va,allons,allez,vont
avoir|haben|ai,as,a,avons,avez,ont
battre|schlagen|bats,bats,bat,battons,battez,battent
boire|trinken|bois,bois,boit,buvons,buvez,boivent
connaître|kennen (Person, Ort)|connais,connais,connaît/connait,connaissons,connaissez,connaissent
détruire|zerstören|détruis,détruis,détruit,détruisons,détruisez,détruisent
convaincre|überzeugen|convaincs,convaincs,convainc,convainquons,convainquez,convainquent
courir|rennen|cours,cours,court,courons,courez,courent
croire|glauben|crois,crois,croit,croyons,croyez,croient
devoir|müssen|dois,dois,doit,devons,devez,doivent
dire|sagen|dis,dis,dit,disons,dites,disent
écrire|schreiben|écris,écris,écrit,écrivons,écrivez,écrivent
envoyer|schicken|envoie,envoies,envoie,envoyons,envoyez,envoient
être|sein|suis,es,est,sommes,êtes,sont
faire|machen|fais,fais,fait,faisons,faites,font
falloir|nötig sein (il … = man muss)|faut
fuir|fliehen|fuis,fuis,fuit,fuyons,fuyez,fuient
lire|lesen|lis,lis,lit,lisons,lisez,lisent
mettre|legen, stellen, setzen|mets,mets,met,mettons,mettez,mettent
mourir|sterben|meurs,meurs,meurt,mourons,mourez,meurent
offrir|schenken, anbieten|offre,offres,offre,offrons,offrez,offrent
plaire|gefallen|plais,plais,plaît/plait,plaisons,plaisez,plaisent
pleuvoir|regnen|pleut
pouvoir|können (dürfen)|peux,peux,peut,pouvons,pouvez,peuvent
prendre|nehmen|prends,prends,prend,prenons,prenez,prennent
recevoir|bekommen, erhalten|reçois,reçois,reçoit,recevons,recevez,reçoivent
rire|lachen|ris,ris,rit,rions,riez,rient
savoir|wissen|sais,sais,sait,savons,savez,savent
suffire|genügen|suffis,suffis,suffit,suffisons,suffisez,suffisent
suivre|folgen|suis,suis,suit,suivons,suivez,suivent
se taire|schweigen|me tais,te tais,se tait,nous taisons,vous taisez,se taisent
venir|kommen|viens,viens,vient,venons,venez,viennent
vivre|leben|vis,vis,vit,vivons,vivez,vivent
voir|sehen|vois,vois,voit,voyons,voyez,voient
vouloir|wollen|veux,veux,veut,voulons,voulez,veulent
se souvenir|sich erinnern|me souviens,te souviens,se souvient,nous souvenons,vous souvenez,se souviennent
devenir|werden|deviens,deviens,devient,devenons,devenez,deviennent`;
const VERBS=RAW.split('\n').map(l=>{const[fr,de,f]=l.split('|');return{fr,de,forms:f.split(',')}});
const BY=Object.fromEntries(VERBS.map(v=>[v.fr,v]));
const PRON=['je','tu','il/elle','nous','vous','ils/elles'];
const pron=(v,i)=>v.forms.length===1?'il':i?PRON[i]:(/^[aeiouyhéèêâîô]/.test(v.forms[0])?"j'":'je');
const DAY=864e5;

// ---------- state ----------
const KEY='verbes-v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S={sel:VERBS.map(v=>v.fr),dir:'fr',cards:{},session:null};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const card=fr=>S.cards[fr]||(S.cards[fr]={ease:2.5,ivl:0,due:0,reps:0,lapses:0,err:[0,0,0,0,0,0]});
const status=fr=>{const c=S.cards[fr];if(!c||(!c.reps&&!c.lapses))return'new';return c.ivl>=7?'sure':'learn'};
const isDue=fr=>!S.cards[fr]||S.cards[fr].due<=Date.now();

// ---------- checking ----------
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').trim();
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function judge(input,answer){ // 0 richtig, .5 nur Akzent, 1 falsch
  const a=answer.split('/').map(norm),x=norm(input);
  if(a.includes(x))return 0;
  if(x&&a.some(y=>strip(y)===strip(x)))return .5;
  return 1;
}

// ---------- spaced repetition (vereinfachtes SM-2) ----------
// g: 0 Nochmals, 1 Schwer, 2 Gut, 3 Einfach
function schedule(fr,g,mode){
  const c=card(fr),now=Date.now();
  if(mode==='all'&&g>=2&&c.reps>0)return; // freies Üben schiebt nichts nach hinten
  if(g===0){c.lapses++;c.reps=0;c.ease=Math.max(1.3,c.ease-.2);c.ivl=0;c.due=now+6e4;return}
  if(g===1){c.ease=Math.max(1.3,c.ease-.15);c.ivl=c.reps?Math.max(1,c.ivl*1.2):1}
  if(g===2)c.ivl=c.reps===0?1:c.reps===1?3:c.ivl*c.ease;
  if(g===3){c.ivl=c.reps===0?3:c.ivl*c.ease*1.3;c.ease+=.15}
  c.reps++;c.due=now+c.ivl*DAY;
}
function preview(fr,g){ // Text für die Buttons
  const c=card(fr);
  if(S.session.mode==='all'&&g>=2&&c.reps>0)return'unverändert';
  const ivl=g===0?0:g===1?(c.reps?Math.max(1,c.ivl*1.2):1):g===2?(c.reps===0?1:c.reps===1?3:c.ivl*c.ease):(c.reps===0?3:c.ivl*c.ease*1.3);
  return ivl===0?'gleich nochmals':Math.round(ivl)===1?'1 Tag':Math.round(ivl)+' Tage';
}

// ---------- home ----------
const app=document.getElementById('app');
function home(){
  const sel=S.sel.filter(f=>BY[f]);
  const due=sel.filter(isDue).length,neu=sel.filter(f=>status(f)==='new').length,sure=sel.filter(f=>status(f)==='sure').length;
  const s=S.session;
  let next='';
  if(!due&&sel.length){const d=Math.min(...sel.map(f=>S.cards[f].due));next=`<p class="hint">Heute ist nichts mehr fällig. Nächste Wiederholung: ${new Date(d).toLocaleString('de-CH',{weekday:'long',hour:'2-digit',minute:'2-digit'})}.</p>`}
  app.innerHTML=`
  <h1>Verbes</h1><p class="sub">Présent · ${VERBS.length} Verben</p>
  <div class="stats">
    <div class="stat"><b>${due}</b><span>fällig</span></div>
    <div class="stat"><b>${neu}</b><span>neu</span></div>
    <div class="stat"><b>${sure}</b><span>sicher</span></div>
  </div>
  ${s?`<button class="btn primary" id="resume">Runde fortsetzen (${s.done} / ${s.total})</button>`:''}
  <button class="btn ${s?'':'primary'}" id="due" ${due?'':'disabled'}>Fällige lernen (${due})</button>
  <button class="btn" id="all" ${sel.length?'':'disabled'}>Alle ${sel.length} Verben durchgehen</button>
  ${next}
  <p class="hint">«Alle durchgehen» ist zum Pauken: Fehler fliessen in die Wiederholung ein, richtige Antworten verschieben nichts.</p>
  <h2>Abfrage</h2>
  <div class="seg" role="radiogroup" aria-label="Richtung">
    ${[['de','Deutsch → Franz.'],['fr','Französisch'],['mix','Gemischt']].map(([k,t])=>`<label><input type="radio" name="dir" value="${k}" ${S.dir===k?'checked':''}>${t}</label>`).join('')}
  </div>
  <p class="hint">${S.dir==='fr'?'Du siehst den Infinitiv und konjugierst.':'Bei Deutsch gibst du zuerst den französischen Infinitiv ein, dann konjugierst du.'}</p>
  <div class="row-head"><h2>Verbes retenus</h2><span><button class="link" id="selAll">Alle</button><button class="link" id="selNone">Keine</button></span></div>
  <div class="chips">${VERBS.map(v=>{const st=status(v.fr),sym={new:'○',learn:'◐',sure:'●'}[st],lab={new:'neu',learn:'am Lernen',sure:'sicher'}[st];
    return`<button class="chip" data-fr="${v.fr}" aria-pressed="${S.sel.includes(v.fr)}" aria-label="${v.fr}, ${lab}"><span class="st" aria-hidden="true">${sym}</span>${v.fr}</button>`}).join('')}</div>
  <p class="legend">○ neu · ◐ am Lernen · ● sicher (Abstand ab 7 Tagen)</p>
  <div class="row-head"><span id="reset"><button class="link danger" id="resetBtn">Fortschritt zurücksetzen</button></span></div>`;
  const on=(id,f)=>{const e=document.getElementById(id);e&&(e.onclick=f)};
  on('resume',next_);on('due',()=>start('due'));on('all',()=>start('all'));
  on('selAll',()=>{S.sel=VERBS.map(v=>v.fr);save();home()});
  on('selNone',()=>{S.sel=[];save();home()});
  on('resetBtn',()=>{document.getElementById('reset').innerHTML=`<span class="confirm">Alles löschen? <button class="link danger" id="yes">Zurücksetzen</button><button class="link" id="no">Abbrechen</button></span>`;
    on('yes',()=>{S.cards={};S.session=null;save();home()});on('no',home)});
  app.querySelectorAll('input[name=dir]').forEach(r=>r.onchange=()=>{S.dir=r.value;save();home()});
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const f=c.dataset.fr;S.sel=S.sel.includes(f)?S.sel.filter(x=>x!==f):[...S.sel,f];save();home()});
}

// ---------- session ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(mode){
  let ids=shuffle(S.sel.filter(f=>BY[f]&&(mode==='all'||isDue(f))));
  if(mode==='due')ids.sort((a,b)=>(S.cards[a]?S.cards[a].due:Infinity)-(S.cards[b]?S.cards[b].due:Infinity)); // Wiederholungen zuerst, dann neue
  if(!ids.length)return;
  S.session={mode,queue:ids,total:ids.length,done:0};save();next_();
}
let cur=null;
function next_(){
  const s=S.session;
  if(!s||!s.queue.length){const t=s?s.total:0;S.session=null;save();return done(t)}
  const v=BY[s.queue[0]];
  const dir=S.dir==='mix'?(Math.random()<.5?'de':'fr'):S.dir;
  cur={v,dir,phase:dir==='de'?'inf':'table',infErr:0,errors:0};
  drill();
}
function drill(){
  const s=S.session,{v,dir}=cur,c=card(v.fr);
  app.innerHTML=`
  <div class="top"><button class="link" id="quit">‹ Beenden</button><span class="count">${s.done} / ${s.total}</span></div>
  <div class="bar"><i style="width:${s.done/s.total*100}%"></i></div>
  <section class="card">
    <div class="tense">Présent · ${dir==='de'?'Deutsch → Französisch':'Französisch'}</div>
    <h1 class="word" lang="${dir==='de'?'de':'fr'}">${dir==='de'?v.de:v.fr}</h1>
    <div id="inf"></div>
  </section>
  <section class="card" id="table" ${cur.phase==='inf'?'hidden':''} lang="fr">
    ${v.forms.map((f,i)=>`<div class="line ${v.forms.length>1&&c.err[i]>=2?'weak':''}"><label class="pr" for="f${i}">${pron(v,i)}</label><input type="text" id="f${i}" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${i===v.forms.length-1?'done':'next'}"><span class="mark" aria-hidden="true"></span></div><div class="fix" id="x${i}" aria-live="polite"></div>`).join('')}
    ${v.forms.length>1&&c.err.some(e=>e>=2)?'<p class="weaknote">• Hier hattest du schon öfter Fehler.</p>':''}
  </section>
  <div id="actions"></div>
  <div class="acc" aria-label="Akzente">${'é è ê ë à â ç î ï ô û ù œ'.split(' ').map(a=>`<button tabindex="-1" data-a="${a}">${a}</button>`).join('')}</div>`;
  document.getElementById('quit').onclick=home;
  app.querySelectorAll('.acc button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>insert(b.dataset.a)});
  app.querySelectorAll('#table input').forEach((inp,i,all)=>inp.onkeydown=e=>{if(e.key!=='Enter'||cur.phase!=='table')return;e.preventDefault();e.stopPropagation();const n=[...all].slice(i+1).find(x=>!x.value)||[...all].find(x=>!x.value);n?n.focus():check()});
  if(cur.phase==='inf'){
    const box=document.getElementById('inf');
    box.innerHTML=`<div class="inf"><input type="text" id="infIn" lang="fr" placeholder="Infinitiv auf Französisch" aria-label="Infinitiv auf Französisch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"><button class="btn primary" id="infGo">Weiter</button></div>`;
    const inp=document.getElementById('infIn');inp.focus();
    const go=()=>{const r=judge(inp.value,v.fr);cur.infErr=r;cur.phase='table';
      box.innerHTML=`<p class="result" style="color:var(--${r===0?'ok':r<1?'warn':'bad'})">${r===0?'✓':r<1?'~':'✗'} ${v.fr}${r?` <span style="font-weight:400">(du: ${esc(inp.value)||'–'})</span>`:''}</p>`;
      document.getElementById('table').hidden=false;document.getElementById('f0').focus();actions()};
    document.getElementById('infGo').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
  }else{document.getElementById('f0').focus();actions()}
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let last=null;document.addEventListener('focusin',e=>{if(e.target.matches('input[type=text]'))last=e.target});
function insert(ch){const i=last;if(!i||i.readOnly)return;const a=i.selectionStart??i.value.length,b=i.selectionEnd??a;i.value=i.value.slice(0,a)+ch+i.value.slice(b);i.focus();i.setSelectionRange(a+1,a+1)}
function actions(){
  const box=document.getElementById('actions');
  if(cur.phase==='table'){box.innerHTML=`<button class="btn primary" id="chk">Prüfen</button>`;document.getElementById('chk').onclick=check;return}
}
function check(){
  const {v}=cur,c=card(v.fr);let sum=cur.infErr,right=0;
  v.forms.forEach((f,i)=>{
    const inp=document.getElementById('f'+i),r=judge(inp.value,f),cls=r===0?'ok':r<1?'warn':'bad';
    inp.className=cls;inp.readOnly=true;sum+=r;if(r===0)right++;if(r)c.err[i]++;
    inp.nextElementSibling.textContent=r===0?'✓':r<1?'~':'✗';
    const x=document.getElementById('x'+i);x.className='fix '+cls;
    x.textContent=r===0?'':(r<1?'Akzent: ':'Richtig: ')+f.replace('/',' oder ');
  });
  cur.errors=sum;cur.phase='checked';
  const sug=sum===0?2:sum<=.5?2:sum<=2?1:0;cur.sug=sug;
  const names=['Nochmals','Schwer','Gut','Einfach'];
  document.getElementById('actions').innerHTML=`<p class="result" role="status">${right} von ${v.forms.length} richtig${cur.infErr?' · Infinitiv falsch':''}</p>
  <div class="grades">${names.map((n,g)=>`<button class="btn ${g===sug?'primary':''}" data-g="${g}">${n}<small>${preview(v.fr,g)}</small></button>`).join('')}</div>
  <p class="hint">Enter wählt den Vorschlag, Tasten 1–4 wählen direkt.</p>`;
  app.querySelectorAll('.grades .btn').forEach(b=>b.onclick=()=>grade(+b.dataset.g));
  app.querySelector('.grades .primary').focus();
}
document.addEventListener('keydown',e=>{
  if(!cur||cur.phase!=='checked'||!S.session)return;
  if(e.key==='Enter'){e.preventDefault();grade(cur.sug)}
  else if('1234'.includes(e.key)&&e.key.length===1){grade(+e.key-1)}
});
function grade(g){
  const s=S.session,fr=cur.v.fr;cur.phase='done';
  schedule(fr,g,s.mode);s.queue.shift();
  if(g===0)s.queue.splice(Math.min(3,s.queue.length),0,fr);        // in ca. 1 Minute nochmals
  else if(s.mode==='all'&&cur.errors>=1)s.queue.push(fr);           // am Ende der Runde nochmals
  else s.done++;
  save();next_();
}
function done(t){
  cur=null;
  app.innerHTML=`<h1>Runde fertig</h1><p class="sub">${t?`Du hast alle ${t} Verben dieser Runde richtig konjugiert.`:'Keine Verben in dieser Runde.'}</p><button class="btn primary" id="back">Zur Übersicht</button>`;
  document.getElementById('back').onclick=home;document.getElementById('back').focus();
}
